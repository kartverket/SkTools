assert project.gradle.gradleVersion >= '1.0-milestone-7'

buildscript {

    // Variables to grab from environment
    ['COMPUTERNAME', 'PUBLIC_REPO', 'GRADLE_HOME', 'GROOVY_HOME'].each { val ->
        if (!project.hasProperty(val) && System.getenv(val) != null) {
            project.setProperty(val, System.getenv(val))
        }
    }

    if (!project.hasProperty('PUBLIC_REPO')) {
        project.setProperty('PUBLIC_REPO', 'http://skrivap92.statkart.no:8001/nexus/content/groups/public/')
    }

}



allprojects {
    apply plugin: 'idea'

    defaultTasks 'build'
    group = 'no.statkart.sktools'

    plugins.whenPluginAdded() {
        if (it instanceof org.gradle.api.plugins.MavenPlugin) {
            uploadArchives.repositories.mavenDeployer {
                if (!version.contains("SNAPSHOT")) {
                    repository(url: uri(properties.get('REPO_UPLOAD_RELEASES', 'http://skrivap92.statkart.no:8001/nexus/content/repositories/releases/'))) {
                        authentication(userName: "admin", password: "admin123")
                    }
                } else {
                    repository(url: uri(properties.get('REPO_UPLOAD_SNAPSHOTS', 'http://skrivap92.statkart.no:8001/nexus/content/repositories/snapshots/'))) {
                        authentication(userName: "admin", password: "admin123")
                    }
                }
            }
        }
    }
}


// build a map of the dependency artifacts to use. Allows centralized definition of the versions of artifacts to
// use. In that respect it serves a role similar to <dependencyManagement> in Maven
libraries = [

        gradleAPI: files(
                "${GRADLE_HOME}/lib/gradle-open-api-${project.gradle.gradleVersion}.jar",
        ),

        // Testing
        testng: 'org.testng:testng:6.0.1',
        hsqldb: 'org.hsqldb:hsqldb:2.2.8',
]



def boolean isJavaProject(Project project) {
    return project.subprojects.size() == 0 && !project.name.endsWith('-ear') && !project.name.endsWith('-test')
}


subprojects { Project project ->
    apply plugin: 'project-report'
    apply plugin: 'base'


    repositories {
        mavenLocal()
        mavenRepo name: 'public', url: "${rootProject.PUBLIC_REPO}"
    }


    if (isJavaProject(project)) {
        apply plugin: 'java'

        sourceCompatibility = '1.6'
        targetCompatibility = '1.6'


        // appropriately inject the common dependencies into each sub-project
        dependencies {

            testCompile libraries.testng

        }



        ['main', 'test'].each { String scope ->
            def unfilteredPropertiesDir = project.file("src/${scope}/resources.filtered")
            def filteredResourcesDir = project.file("${project.buildDirName}/generated/${scope}/resources")

            def scopeName = scope.replaceFirst(".") {it[0].toUpperCase()}

            if (unfilteredPropertiesDir.isDirectory()) {
                def filterTask = task("filter${scopeName}Resources") {
                    inputs.dir(unfilteredPropertiesDir)
                    inputs.properties(filterProperties)
                    outputs.dir(filteredResourcesDir)
                    doLast {
                        delete(filteredResourcesDir);
                        copy {
                            from(unfilteredPropertiesDir)
                            into(filteredResourcesDir)
//                            filter(ReplaceTokens, tokens: filterProperties)
                        }
                        ant.touch() { fileset(dir: filteredResourcesDir)}
                    }
                }
                project.sourceSets."$scope".resources.srcDir filteredResourcesDir
                project.processResources.dependsOn filterTask

                def createDirTask = task("createFilteredResourceDir", type: Directory) { dir = filteredResourcesDir }
                project.tasks.ideaModule.dependsOn createDirTask
            }
        }



        // Får Idea til å legge build katalog for alle moduler i en egen felles topp katalog (out/production, out/test)
        project.idea.module {
            inheritOutputDirs = true
//            scopes.PROVIDED.plus += configurations.provided
        }


        test {
            useTestNG() {
                excludeGroups('broken')
            }

            jvmArgs '-Xmx512m'
            if (rootProject.hasProperty('test.remote.debug')) {
                jvmArgs '-Xdebug'
                jvmArgs '-Xnoagent'
                jvmArgs '-Xrunjdwp:transport=dt_socket,address=8787,server=y,suspend=y'
            }


            //listening to test execution events
            afterTest { descriptor, result  ->
              logger.lifecycle("Executing: ${descriptor.className}.${descriptor.name} \t\t: ${result}" )
              if (result.resultType.name() == 'FAILURE') {
                  logger.error("${result.exception}")
              }
            }

            onOutput { descriptor, event ->
                if (event.destination == TestOutputEvent.Destination.StdErr) {
                    logger.error('' + descriptor + ", error: " + event.message)
                } else {
                    logger.info('\t' + event.message)
                }
            }

        }
    }	
}


idea.project {
    jdkName = '1.6'
    languageLevel = '1.6'

    ipr {
        //adding Perforce as default vcs by tinkering with the output *.ipr file before it's written out
        withXml {
            def node = it.asNode()
            def component = node.appendNode('component', ['name': 'VcsDirectoryMappings'])
            component.appendNode('mapping', ['directory': '', 'vcs': 'Perforce'])
        }
    }
}