name: Build and Publish

on:
    push:
        branches:
            - '**'
    workflow_dispatch:


env:
    ARTIFACT: sktools # Hvordan sette denne for hver plugin?
    MAJ_VER: test # Vet ikke major versjon??

jobs:
    calculate-version:
        name: Calculate Version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version-string.outputs.version }}
            image: ${{ steps.version-string.outputs.image }}

        steps:
            -   name: Generate version string
                id: version-string
                shell: bash
                run: |
                    version="${{ env.MAJ_VER }}.$(date -u '+%Y.%m.%d-%H.%M')-$(echo "${GITHUB_SHA}" | cut -c1-7)"
                    echo "version=${version}" >> "$GITHUB_OUTPUT"
                    echo "image=ghcr.io/kartverket/sktools/${{ env.ARTIFACT }}:${version}" >> "$GITHUB_OUTPUT"
    build:
        name: Build
        runs-on: ubuntu-latest
        needs:
            - calculate-version

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            -   name: Sett opp JDK 17 for x64
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    architecture: x64

            - name: Validate Gradle wrapper
              uses: gradle/actions/wrapper-validation@v4

            - name: Prepare
              run: ./gradlew clean --refresh-dependencies --stacktrace --warning-mode=fail -Psktools_versjon=${{ needs.calculate-version.outputs.version }}

            - name: Build
              run: ./gradlew assemble --stacktrace --warning-mode=fail -Psktools_versjon=${{ needs.calculate-version.outputs.version }}

    test:
        name: Unit tests (Gradle ${{ matrix.gradle-version }})
        runs-on: ubuntu-latest
        needs:
            - calculate-version

        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                gradle-version: ['7.0', '8.1.1']

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            -   name: Sett opp JDK 17 for x64
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    architecture: x64

            - name: Validate Gradle wrapper
              uses: gradle/actions/wrapper-validation@v4

            - name: Grant execute permission to Gradlew
              run: chmod +x ./gradlew

            - name: Run tests
              run: ./gradlew test --continue --stacktrace --warning-mode=fail -Psktools_versjon=${{ needs.calculate-version.outputs.version }}
              continue-on-error: true

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-gradle-${{ matrix.gradle-version }}
                  path: '**/build/test-results/test/*.xml'
                  retention-days: 30

    publish:
        name: Publish to GitHub Packages
        runs-on: ubuntu-latest
        needs:
            - build
            - test
            - calculate-version
        if: github.ref_name == 'trunk'

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            -   name: Sett opp JDK 17 for x64
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    architecture: x64

            - name: Publish to GitHub Packages
              run: ./gradlew publish --stacktrace --warning-mode=fail -Psktools_versjon=${{ needs.calculate-version.outputs.version }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
