name: Build and Publish

on:
    push:
        branches:
            - 'trunk'
    pull_request:
    workflow_dispatch:

env:
    MAJOR_VERSION: 7

jobs:
    calculate-version:
        name: Calculate Version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version-string.outputs.version }}

        steps:
            -   name: Generate version string
                id: version-string
                shell: bash
                run: |
                    version="${{ env.MAJOR_VERSION }}.$(date -u '+%Y.%m.%d-%H.%M')-$(echo "${GITHUB_SHA}" | cut -c1-7)"
                    echo "version=${version}" >> "$GITHUB_OUTPUT"
    build:
        name: Build
        runs-on: ubuntu-latest
        needs:
            - calculate-version

        permissions:
            contents: read

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Sett opp JDK 17 for x64
                uses: actions/setup-java@v5
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    architecture: x64

            -   name: Validate Gradle wrapper
                uses: gradle/actions/wrapper-validation@v6.3.0

            -   name: Grant execute permission to Gradlew
                run: chmod +x ./gradlew

            -   name: Prepare
                run: ./gradlew clean --refresh-dependencies --stacktrace --warning-mode=all -Psktools_versjon=${{ needs.calculate-version.outputs.version }}

            -   name: Build
                run: ./gradlew assemble --stacktrace --warning-mode=all -Psktools_versjon=${{ needs.calculate-version.outputs.version }}

    test:
        name: Kjør tester
        runs-on: ubuntu-latest
        needs:
            - calculate-version

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Sett opp JDK 17 for x64
                uses: actions/setup-java@v5
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    architecture: x64

            -   name: Validate Gradle wrapper
                uses: gradle/actions/wrapper-validation@v6.3.0

            -   name: Grant execute permission to Gradlew
                run: chmod +x ./gradlew

            -   name: Run tests
                run: ./gradlew test --continue --stacktrace --warning-mode=all -Psktools_versjon=${{ needs.calculate-version.outputs.version }}

            -   name: Publish Test Report
                if: ${{ always() }}
                uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
                with:
                    report_paths: '**/buildGradle*/test-results/*/*.xml'
                    check_name: Test rapport
                    annotate_only: true
                    detailed_summary: true
    publish:
        name: Publish to GitHub Packages
        runs-on: ubuntu-latest
        needs:
            - build
            - test
            - calculate-version
        if: github.ref_name == 'trunk' && github.event_name != 'pull_request'

        permissions:
            contents: read
            packages: write

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Sett opp JDK 17 for x64
                uses: actions/setup-java@v5
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    architecture: x64

            -   name: Grant execute permission to Gradlew
                run: chmod +x ./gradlew

            -   name: Publish to GitHub Packages
                run: ./gradlew publish --stacktrace --warning-mode=all -Psktools_versjon=${{ needs.calculate-version.outputs.version }}
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
