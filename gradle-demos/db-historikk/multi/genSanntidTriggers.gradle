/*
  Script for automatisk generering av trigger DDL for sanntid skjema.
  Triggere oppdaterer historikkdata og eies av historikk brukeren.

  Det er valgfritt hvilke historikk-felter som blir eksponert (om noen). Dersom en tabell ikke skal med, deklarer dette i includeTables/excludeTables.

  Resultatet blir returnert som streng.


  Bruk:

  Benytt closure hektet inn på ext.genSanntidTriggers med følgende parametere:

    dbToolset - for connection
    sanntidSourceSchema - skjema for sanntids-tabeller
    sanntidSchemaName - skjema for sanntid (default <sanntidSourceSchema>)

    Valgfrie Parametere:

    historikkSchemaName - samme som <historikkViewSchemaName>
    historikkViewSchemaName - skjema for historikk-views

    includeTables - {closure} for filtrering av tabellnavn for prosessering
    excludeTables - {closure} for filtrering av tabellnavn for prosessering

    ignoredColumnNames - map av kolonnenavn per tabellnavn (key) som ignoreres

 */

ext.genSanntidTriggers = { Map params ->

    // parameters

    final def dbToolset = params.get('dbToolset')
    assert dbToolset // toolset as mandatory parameter

    final String sanntidSourceSchema = params.get('sanntidSourceSchema')
    assert sanntidSourceSchema // source schema as mandatory parameter

    final String historikkSchemaName = params.get('historikkSchemaName')
    final String historikkViewSchemaName = params.get('historikkViewSchemaName', historikkSchemaName)
    final String sanntidSchemaName = params.get('sanntidSchemaName', sanntidSourceSchema)
    assert sanntidSchemaName // schema name as mandatory parameter

    final def includeTables = params.get('includeTables', { true })
    final def excludeTables = params.get('excludeTables', { it.endsWith('_H') })

    final def ignoredColumnNames = params.get('ignoredColumnNames', [:]) //kan trolig ikke ignorere noen kollonner i view eller triggere...

    // implementert navn for historikk-kolonner (disse må være like i sanntid-db og historikk-db)
    final Map historikkColumnNames = (Map) params.get('historikkColumnNames', ['TVERSION', 'TBEGIN_INFO', 'TEND_INFO', 'TBEGIN', 'TEND'].collectEntries { [it, it.toString()] })

    // variables

    def oracleConvention = dbToolset


    def sql = null
    try {
        sql = groovy.sql.Sql.newInstance(oracleConvention.url, oracleConvention.credentials.username, oracleConvention.credentials.password, oracleConvention.driver)
    } finally {
        if (!sql) logger.error "Error connecting to database: ${oracleConvention.url} [${oracleConvention.credentials.username}]"
    }
    println("connected to source database: ${sql.connection.metaData.URL} [${sql.connection.metaData.userName}]")


    final StringWriter schemaDDL = new StringWriter()

    //algorithm

    def writeTriggersForSanntidTable = { Writer out, CharSequence triggerSchemaName, CharSequence triggerName, CharSequence sanntidTableSchemaName, CharSequence sanntidTableName, CharSequence historikkViewName, List pkColumns, Map columnMappingForTable ->
        def quotedHistorikkSchemaNameDot = triggerSchemaName ? "\"${triggerSchemaName}\"." : ''
        def quotedSanntidSchemaNameDot = sanntidTableSchemaName ? "\"${sanntidTableSchemaName}\"." : ''

        def noneHistorikkColumns = columnMappingForTable.keySet().collectMany {!historikkColumnNames.containsValue(it) ? [it] : [] }

        if (!pkColumns.intersect(historikkColumnNames.values()).isEmpty()) {
            logger.warn "Primary Key for sanntidstabeller kan ikke inneholde kollonner for historikk. Genererte triggere er ikke garantert til å virke."
        }

        out.write "\n"
        out.write """
-- Trigger for ${quotedSanntidSchemaNameDot}${sanntidTableName} (sanntid-db)
CREATE OR REPLACE TRIGGER ${quotedHistorikkSchemaNameDot}"${triggerName}"
  BEFORE INSERT OR UPDATE OR DELETE ON ${quotedSanntidSchemaNameDot}"${sanntidTableName}"
  FOR EACH ROW

  BEGIN

  -- Delegerer like operasjoner til historikk-db..
  IF INSERTING THEN
    INSERT INTO ${quotedHistorikkSchemaNameDot}"${historikkViewName}"
    COLUMNS (
      ${
            noneHistorikkColumns.collect {
                "\"${columnMappingForTable.get(it)}\""
            }.join(', \n      ')
        }
    ) VALUES (
      ${
            noneHistorikkColumns.collect {
                ":new.\"${it}\""
            }.join(', \n      ')
        }
    );
  ELSIF UPDATING THEN
    UPDATE ${quotedHistorikkSchemaNameDot}"${historikkViewName}"
    SET
      ${
            noneHistorikkColumns.collect {
                "\"${columnMappingForTable.get(it)}\" = :new.\"${it}\""
            }.join(', \n      ')
        }
    WHERE
      ${
            pkColumns.collect {
                "\"${columnMappingForTable.get(it)}\" = :old.\"${it}\""
            }.join(' AND\n      ')
        }
    ;
  ELSIF DELETING THEN
    DELETE FROM ${quotedHistorikkSchemaNameDot}"${historikkViewName}"
    WHERE
      ${
            pkColumns.collect {
                "\"${columnMappingForTable.get(it)}\" = :old.\"${it}\""
            }.join(' AND\n      ')
        }
    ;
  END IF;

  -- Vedlikeholder historikk-felter i sanntid-db.. ${
            if (columnMappingForTable.find { historikkColumnNames.containsValue(it.key) }) {

                columnMappingForTable.findAll { historikkColumnNames.containsValue(it.key) }.entrySet().with {
                    """
  IF INSERTING OR UPDATING THEN
    SELECT
      ${it.collect {"\"${it.value}\""}.join(',\n      ')}
    INTO
      ${it.collect {":new.\"${it.key}\""}.join(',\n      ')}
    FROM ${quotedHistorikkSchemaNameDot}"${historikkViewName}"
    WHERE
      ${
                        pkColumns.collect {
                            "\"${columnMappingForTable.get(it)}\" = :new.\"${it}\""
                        }.join(' AND\n      ')
                    }
    ;
  END IF;
"""
                }

            } else {
                '''
  -- ..ingen historikkfelter i sanntid å vedlikeholde.
'''
            }
        }


  END "${triggerName}";
/"""

        out.flush()
    }


    def findTableNames = { String userName ->
        Map<String, List> tableNamesForUsers = [:] as LinkedHashMap
        sql.eachRow("select OBJECT_NAME from ALL_OBJECTS where OBJECT_TYPE in ('TABLE') and OWNER like ? and OBJECT_NAME not like '%\$%' escape '\\' order by OBJECT_NAME", [userName]) {
            if (includeTables(it[0])) {
                if (!excludeTables(it[0])) {
                    if (tableNamesForUsers[userName] == null) {
                        tableNamesForUsers[userName] = []
                    }
                    tableNamesForUsers[userName].add(it[0])
                }
            }
        }
        return tableNamesForUsers
    }


    def findColumnNames = { String userName, String tableName, String schema = userName, Closure doIgnoredColumn = {false} ->
        def ret = []

        def resultSet = sql.properties.connection.metaData.getColumns(schema, userName, tableName, null)
        while (resultSet.next()) {
            def columnName = resultSet.getString('COLUMN_NAME')
            if (!doIgnoredColumn(columnName)) {
                ret.add(columnName)
            }
        }
        resultSet.close()

        return ret
    }

    //gives you the column mapping between table (key) and historikk-view (value)
    def findColumnNamesForHistorikkView = { String userName, String tableName, String schema, Closure doIgnoredColumn = {false}, Closure colmapTableToView = {it} ->
        def mapping = [:] as LinkedHashMap

        def columnNamesForView = findColumnNames(userName, tableName, schema, doIgnoredColumn)
        columnNamesForView.each {
            mapping.put(it, colmapTableToView(it))
        }

        return mapping
    }

    def findPKColumnNames = { String schemaForTableName, tableName ->
        def ret = []
        def resultSet = sql.properties.connection.metaData.getPrimaryKeys(null, schemaForTableName, tableName)
        while (resultSet.next()) {
            ret[resultSet.getInt('KEY_SEQ') - 1] = resultSet.getString('COLUMN_NAME')
        }
        resultSet.close()
        return ret
    }


    def tableNamesForUsers = findTableNames(sanntidSourceSchema)
    tableNamesForUsers.each { String schemaName, def tableNames ->
        tableNames.each { String tableName ->
            logger.quiet "Processing table '${tableName}' from schema ${schemaName}..."

            def doIgnoreColumn = { ignoredColumnNames[tableName] ?: [] }

            Collection pkColumns = findPKColumnNames(schemaName, tableName)
            if (pkColumns.empty) {
                logger.warn "Unique/PK columns not found for table ${schemaName}.${tableName}.}"
            }

            def columnMappingForTable = findColumnNamesForHistorikkView(sanntidSourceSchema, tableName, schemaName, doIgnoreColumn)

            schemaDDL.println("PROMPT Creating Trigger for ${tableName} ...")
            def historikkViewName = tableName; // tabell/view for historikk-db samsvarere med sanntid tabellnavn
            writeTriggersForSanntidTable(schemaDDL, historikkViewSchemaName, "T_S_${tableName}", sanntidSchemaName, tableName, historikkViewName, pkColumns, columnMappingForTable)

            schemaDDL.println()
            schemaDDL.println()
            schemaDDL.println()
        }
    }

    if (tableNamesForUsers.isEmpty()) {
        logger.quiet "No tables found for user ${sanntidSourceSchema}. Is the schema currently empty?"
    }

    return schemaDDL.toString()
}