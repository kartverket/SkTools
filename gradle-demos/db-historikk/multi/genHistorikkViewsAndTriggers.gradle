/*
  Script for automatisk generering av view DDL for historikk skjema.
  Resultatet blir returnert som streng.

  Bruk:

  Benytt closure hektet inn på ext.genHistorikkViewsAndTriggers med følgende parametere:

    dbToolset - dbToolset som beskriver connection det skal leses i fra

    Valgfrie Parametere:

    includeTables - {closure} for filtrering av tabellnavn for prosessering
    excludeTables - {closure} for filtrering av tabellnavn for prosessering

    ignoredColumnNames - map av kolonnenavn per tabellnavn (key) som ignoreres

 */

ext.genHistorikkViewsAndTriggers = { Map params ->

    // parameters

    final def dbToolset = params['dbToolset']
    assert dbToolset // dbToolset is mandatory parameter


    final def includeTables = params.get('includeTables', { it.endsWith('_H') })
    final def excludeTables = params.get('excludeTables', { !it.endsWith('_H') })

    final def ignoredColumnNames = params.get('ignoredColumnNames', [:]) //kan trolig ikke ignorere noen kollonner i view eller triggere...

    // implementert navn for historikk-kolonner (disse må være like i sanntid-db og historikk-db)
    final Map historikkColumnNames = params.get('historikkColumnNames', ['TVERSION', 'TBEGIN_INFO', 'TEND_INFO', 'TBEGIN', 'TEND'].collectEntries { [it, it.toString()] })
    assert historikkColumnNames.TVERSION //mandatory column for historikk-data
    assert historikkColumnNames.TBEGIN //mandatory column for historikk-data
    assert historikkColumnNames.TEND //mandatory column for historikk-data


    //bestemmer hvorvidt trigger skal sette brukernavn for historikk-data
    final def isSetUsernameOnUpdate = params.get('setUsername') ?: historikkColumnNames.containsKey('TBEGIN_INFO')
    final def isSetUsernameOnDelete = params.get('setUsername') ?: historikkColumnNames.containsKey('TEND_INFO')


    // variables

    def oracleConvention = dbToolset
    String username = oracleConvention.credentials.username


    def sql
    try {
        sql = groovy.sql.Sql.newInstance(oracleConvention.url, username, oracleConvention.credentials.password, oracleConvention.driver)
    } finally {
        if (!sql) logger.error "Error connecting to database: ${oracleConvention.url} [${username}]"
    }
    println("connected to source database: ${sql.connection.metaData.URL} [${sql.connection.metaData.userName}]")


    final StringWriter schemaDDL = new StringWriter()



    //algorithm

    def writeDDLForView = { Writer out, String viewName, Map columnMapping ->

        out.write "\n"
        out.write "-- View for ${viewName}\n"
        out.write "CREATE OR REPLACE VIEW \"${viewName}\" (\n"
        out.write columnMapping.values().collect{"   \"${it}\""}.join(',\n')
        out.write "\n) AS SELECT \n"
        out.write columnMapping.keySet().collect{"   h.\"${it}\""}.join(',\n')
        out.write "\n FROM \"${viewName}_H\" h"
        out.write "\n WHERE "
//GBOK-1482 - versjon 3:
        out.write "\n     (h.\"${historikkColumnNames.TEND}\" > SNAPSHOT_TIME.Get_T() AND h.\"${historikkColumnNames.TBEGIN}\" <= SNAPSHOT_TIME.Get_T()) "
        out.write "\n  OR (h.\"${historikkColumnNames.TEND}\" = SNAPSHOT_TIME.Get_T_CURRENT() AND h.\"${historikkColumnNames.TBEGIN}\" <= SNAPSHOT_TIME.Get_T()) "

//GBOK-1482 - versjon 2:
//            out.write "\n     (snapshot_time.Get_T() < h.\"${historikkColumNames.TEND}\" OR h.\"${historikkColumNames.TEND}\" = snapshot_time.Get_T_CURRENT()) "
//            out.write "\n  AND h.\"${historikkColumNames.TBEGIN}\" <= snapshot_time.Get_T()"

//versjon 1:
//            out.write "\n     snapshot_time.T_Between(h.\"${historikkColumNames.TBEGIN}\", h.\"${historikkColumNames.TEND}\") = 1"

        out.write "\n;"
        out.flush()
    }


    //view kan ha annen felt-rekkefølge enn skygge-tabell
    def writeTriggersForView = { Writer out, String triggerName, String viewName, String hTableName, def pkColumns, Map columnMappingForView, def columnNamesForTable ->

        out.write "\n"
        out.write """
-- Trigger for ${viewName} (historikk-db)
CREATE OR REPLACE TRIGGER "${triggerName}"
  INSTEAD OF INSERT OR UPDATE OR DELETE ON "${viewName}"
  FOR EACH ROW
  DECLARE
    t_Trans TIMESTAMP(9) := SNAPSHOT_TIME.Get_T_Trans();
    t_End TIMESTAMP(9) := SNAPSHOT_TIME.Get_T_CURRENT();
    ${(isSetUsernameOnUpdate || isSetUsernameOnDelete) ? 't_User VARCHAR2(255 CHAR) := SNAPSHOT_TIME.Get_Bruker();' : ''}

    LOGISK_FEIL EXCEPTION;
  BEGIN

  IF snapshot_time.GeT_T() <> t_End THEN
    RAISE_APPLICATION_ERROR(-20100, 'Modifikasjon mot historikk-data fungerer kun med t satt til t_CURRENT');
  END IF;

  IF INSERTING THEN
     INSERT INTO "${hTableName}"
        VALUES (
           ${
            columnNamesForTable.collect {
                if (it == historikkColumnNames.TBEGIN) return 't_Trans'
                if (it == historikkColumnNames.TEND) return 't_End'        //levende objekter har denne tend verdi
                if (it == historikkColumnNames.TVERSION) return 1          //nye objekter inserted via view får version=1 (default 0)
                if (it == historikkColumnNames.TBEGIN_INFO && isSetUsernameOnUpdate) return 't_User'
                if (it == historikkColumnNames.TEND_INFO && isSetUsernameOnDelete) return 'null' // ingen verdi (null) for nye objekter.

                return columnMappingForView.containsKey(it) ? ":new.\"${columnMappingForView.get(it)}\"" : 'default'

//                if (it == historikkColumnNames.TBEGIN_INFO && isSetUsernameOnUpdate) return 't_User';
//                if (it == historikkColumnNames.TEND_INFO && isSetUsernameOnDelete) return 't_User';

            }.join(', \n           ')
        }
        );

  ELSIF UPDATING THEN
     IF :old."${historikkColumnNames.TBEGIN}" < t_Trans THEN
        INSERT INTO "${hTableName}" VALUES (
           ${
            columnNamesForTable.collect {
                if (it == historikkColumnNames.TEND) return 't_Trans'
                if (it == historikkColumnNames.TEND_INFO && isSetUsernameOnDelete) return 't_User'

                return columnMappingForView.containsKey(it) ? ":old.\"${columnMappingForView.get(it)}\"" : 'default'
            }.join(', \n           ')
        }
           )
        ;
        UPDATE "${hTableName}" SET --GBOK-1824: setter verdier for transaksjon en og kun kun en gang per transaksjon.
            "${historikkColumnNames.TVERSION}" = :old."${columnMappingForView.get(historikkColumnNames.TVERSION)}" + 1
            , "${historikkColumnNames.TBEGIN}" = t_Trans
            ${(isSetUsernameOnUpdate && historikkColumnNames.TBEGIN_INFO) ? ", \"${historikkColumnNames.TBEGIN_INFO}\" = t_User" : ''}
        WHERE
           ${
            pkColumns.collect {
                if (it == historikkColumnNames.TEND) return "\"${it}\" = t_End";

                return "\"${it}\" = :old.\"${columnMappingForView.get(it)}\"" //GBOK-1422: matcher "current rad" med old verdier for PK
            }.join('\n           AND ')
        }
        ;
     END IF;
     UPDATE "${hTableName}"
        SET
           ${
            columnNamesForTable.findAll { columnMappingForView.containsKey(it) && !historikkColumnNames.containsValue(it) }.collect {

                return "\"${it}\" = ${columnMappingForView.containsKey(it) ? ':new.\"' + columnMappingForView.get(it) + '\"' : 'default'}"
            }.join(', \n           ')
        }
        WHERE
           ${
            pkColumns.collect {
                if (it == historikkColumnNames.TEND) return "\"${it}\" = t_End";
                if (it == historikkColumnNames.TBEGIN) return "\"${it}\" = t_Trans";

                return "\"${it}\" = :old.\"${columnMappingForView.get(it)}\"" //GBOK-1422: matcher "current rad" med old verdier for PK
            }.join('\n           AND ')
        }
        ;

  ELSIF DELETING THEN
     IF :old."${historikkColumnNames.TBEGIN}" < t_Trans THEN
        INSERT INTO "${hTableName}"
           VALUES (
           ${
            columnNamesForTable.collect {
                if (it == historikkColumnNames.TEND) return 't_Trans'
                if (it == historikkColumnNames.TEND_INFO && isSetUsernameOnDelete) return 't_User'

                return columnMappingForView.containsKey(it) ? ":old.\"${columnMappingForView.get(it)}\"" : 'default'

            }.join(', \n           ')
        }
           )
        ;
     END IF;
     DELETE FROM "${hTableName}"
        WHERE
           ${
            pkColumns.collect {
                if (it == historikkColumnNames.TEND) return "\"${it}\" = t_End"

                return "\"${it}\" = :old.\"${columnMappingForView.get(it)}\"" //GBOK-1422: matcher "current rad" med old verdier for PK
            }.join('\n           AND ')
        }
     ;
  END IF;

  END "${triggerName}";
/"""

        out.flush()
    }



    def findTableNames = { String userName ->
        Map<String, List> tableNamesForUsers = [:] as LinkedHashMap
        sql.eachRow("select OBJECT_NAME from ALL_OBJECTS where OBJECT_TYPE in ('TABLE') and OWNER like ? order by OBJECT_NAME", [username]) {
            if (includeTables(it[0])) {
                if (!excludeTables(it[0])) {
                    if (tableNamesForUsers[username] == null) {
                        tableNamesForUsers[username] = []
                    }
                    tableNamesForUsers[username].add(it[0])
                }
            }
        }
        return tableNamesForUsers
    }


    def findColumnNames = { String userName, String tableName, String schema = userName, Closure doIgnoredColumn = {false} ->
        def ret = []

        def resultSet = sql.properties.connection.metaData.getColumns(schema, userName, tableName, null)
        while( resultSet.next() ) {
            def columnName = resultSet.getString('COLUMN_NAME')
            if (!doIgnoredColumn(columnName)) {
                ret.add(columnName)
            }
        }
        resultSet.close()

        return ret
    }


    //gives you the column mapping between table (key) and view (value)
    def findColumnNamesForView = { String userName, String tableName, String schema, Closure doIgnoredColumn = {false}, Closure colmapTableToView = {it} ->
        def mapping = [:] as LinkedHashMap

        def columnNamesForView = findColumnNames(userName, tableName, schema, doIgnoredColumn)
        def actualHistorikkColumnNames = historikkColumnNames.values().intersect(columnNamesForView)

        (columnNamesForView - actualHistorikkColumnNames + actualHistorikkColumnNames).each {
            mapping.put(it, colmapTableToView(it))
        }

        return mapping
    }

    //finner felter som inngår i primærnøkkler ved å se på unique constraint med navn C_HIST_<tabellenavn>
    def findPKColumnNames = { String schema, tableName ->
        def ret = []
        sql.eachRow("select * from ALL_CONS_COLUMNS where OWNER = ? and TABLE_NAME = ? and constraint_name like 'C\\_HIST\\_%' escape '\\' order by POSITION", [schema, tableName]) {
            ret += it.COLUMN_NAME
        }
        return ret
    }


    def tableNamesForUsers = findTableNames(username)
    tableNamesForUsers.each { String schema, def tableNames ->
        tableNames.each { String tableName ->
            logger.quiet "Processing table '${tableName}' from schema ${schema}..."

            def doIgnoreColumn = { ignoredColumnNames[tableName] ?: [] }

            String viewNameForTable = tableName.toString().replaceAll(/\_H$/, '')

            def columnMappingForView = findColumnNamesForView(username, tableName, schema, doIgnoreColumn)

            schemaDDL.println("PROMPT Creating View ${viewNameForTable} ...")
            writeDDLForView(schemaDDL, viewNameForTable, columnMappingForView)


            Collection pkColumns = findPKColumnNames(schema, tableName)

            //select * from user_cons_columns where table_name = 'STED_H' and constraint_name like 'C\_HIST\_%' escape '\' order by position;
            if (!pkColumns.containsAll([historikkColumnNames.TEND, historikkColumnNames.TBEGIN])) {
                logger.warn "Unique/PK columns not found. Expected to have some among ${[historikkColumnNames.TEND, historikkColumnNames.TBEGIN]}"
            }

            def columnNamesForTable = findColumnNames(username, tableName, schema, doIgnoreColumn)
            writeTriggersForView(schemaDDL, "T_H_${viewNameForTable}", "${viewNameForTable}", "${tableName}", pkColumns, columnMappingForView, columnNamesForTable)


            schemaDDL.println()
            schemaDDL.println()
            schemaDDL.println()
        }
    }

    if (tableNamesForUsers.isEmpty()) {
        logger.quiet "No tables found for user ${username}. Is the schema currently empty?"
    }

    return schemaDDL.toString()
}