/******************************************************************************************************************** **
 * Demonstrasjon av hvordan en kan plugge inn generert kode på via conventions og sourceSet.
 * Dette i tilfeller der en ønsker å beholde kode innen samme modul/(gradle Project)
 *
 *  - ressurser blir generert til ./build/resources/<sourceSet> (std gradle path)
 *  - javakode blir generert til ./gen/special/java (custom path)
 *
 * Viser også hvordan man integrerer dette med IntelliJ
 *
 * NB: Merk at generert kode havner i egen jar-fil som havner på classpath i Gradle
 * NB: Generert kildekode bør legges i egen katalog, helst utenfor ./build
 *
 ******************************************************************************************************************** */

apply plugin: 'java'
apply plugin: 'idea'



sourceSets {

    special {
        java.srcDirs = []
//        resources.srcDirs = ["${buildDir}/resources/special"]   //std folder is build/resources/special

        //markering av mappe for generert kildekode her
        // - IntelliJ bryr seg kun om 'main' sourceSet
        allSource.srcDir 'gen/special/java'
    }
}

dependencies {
    compile project(path:project.path, configuration:'specialRuntime')  //compile time avhengighet i gradle

    //fells byggeavhengighet for konfigurasjon i gradle (substituerer dependsOn for alle byggetasks)
    compile project.configurations.specialRuntime
}


//taks som genererer ressurser
task generateSpecialResources { Task it ->
    doLast {
        def generated = project.file("${buildDir}/resources/special/myGeneratedResource.properties")
        generated.parentFile.mkdirs()
        generated.text = "message=Stay happy!"
    }

    project.tasks.processSpecialResources.dependsOn(it)
}


//taks som genererer kildekode
task generateSpecialSource { Task it ->
    doLast {
        def generated = project.file("gen/special/java/special.java")
        generated.parentFile.mkdirs()
        generated.text = '''class Special { public static String getMessage() throws Exception {
            java.util.Properties props = new java.util.Properties();
            props.load(Special.class.getResourceAsStream("myGeneratedResource.properties"));
            return props.get("message").toString();
        }}'''
    }

    project.tasks.clean.doLast {
        println "sletter generert kildekode ./gen"
        project.delete('gen')
    }

    def compileTask = project.tasks.compileSpecialJava
    compileTask.dependsOn(it)
    compileTask.source 'gen/special/java'
}


//task som pakker 'special' jar fil
task jarSpecial(type: Jar, dependsOn: configurations.specialRuntime) {
    appendix = 'special'
    from project.convention.plugins.java.sourceSets.special.output
}


artifacts {
    specialRuntime jarSpecial   //for å holde det simpelt, så brukes generert configurasjon her..
}

/**
 * En har tre strategier for IDEA integrasjon
 * 1. La IDEA bygge allt selv
 * 2. La Gradle tilby enkelte ferdigbyggede deler
 * 3. Mix av 1 og 2 for hhv statisk og generert kildekode
 */

def strategy = ext.properties.get('ideaStrategy', '2')

if (strategy == '1') {
    println "ideaStrategy #1: IDEA bygger alt selv"
    idea.module { module ->
        project.convention.plugins.java.sourceSets.special.allSource.srcDirs.each {
            module.sourceDirs += it
        }
        project.convention.plugins.java.sourceSets.special.resources.srcDirs.each {
            module.sourceDirs += it
        }
        //tar også med out.resources da genererte ressurser blir generert hit (generelt en bedre ide å generere til annen katalog først)
        module.sourceDirs += project.convention.plugins.java.sourceSets.special.output.resourcesDir

        scopes.COMPILE.minus += configurations.default //denne kommer feilaktig med pga compile avhengighet til andre configurations innen dette prosjektet
    }
} else if (strategy == '2') {
    println "ideaStrategy #2: Linker inn byggekataloger som dependency"
    idea.module { module ->
        singleEntryLibraries += [COMPILE:project.convention.plugins.java.sourceSets.special.output.files.findAll{it.mkdirs(); true}]
        //mulighet til også å linke inn tilhøredne kildekode via manipulasjon av iml..
        //todo: <library name="${project.name}-${sourceSet.name?}">
        //todo: trolig best resultat ved å gå direkte mot xmlen istedet for via 'singleEntryLibraries'

        scopes.COMPILE.minus += configurations.default //denne kommer feilaktig med pga compile avhengighet til andre configurations innen dette prosjektet
    }
} else if (strategy == '3') {
    println "ideaStrategy #3: Mix av #1 og #2"

    //for #1) manuelt plukke ut kildekode og generert kildekode
    //for #2) manuelt plukke ut outputkataloger

    //Vanskeligerer å generalisere. En algoritme kan være å defaulte til #2 for så å trekke ut alle output folders for feks resources.
}


/******************************************************************************************************************** **
 * Diverse tasker som tester og demonstrerer implementasjonen
 ******************************************************************************************************************** */

task demo(dependsOn:'clean') {
    description = 'Kjører en enkel demo for å teste funksjonaliteten'

    doLast {

        println 'Printer sourceSets definisjon...'
        forkGradle(['printSourceSets'])

        println 'Tester oppsett av configuration...'
        forkGradle(['assertConfigurations'])

        println 'Tester egen-generering av ressurser...'
        forkGradle(['processSpecialResources', 'assertResources'])

        println 'Tester generering av classes...'
        forkGradle(['compileJava', 'assertJavaSource'])

        println 'Tester classpath via kjøring av eksempelklient...'
        forkGradle(['build', 'assertClasspath'])

        println 'Tester IntelliJ integrasjon strategi#1...'
        forkGradle(['cleanIdea'])
        forkGradle(['ideaModule', 'assertIdeaModule'], [ideaStrategy:'1'])

        println 'Tester IntelliJ integrasjon strategi#2...'
        forkGradle(['cleanIdea'])
        forkGradle(['ideaModule', 'assertIdeaModule'], [ideaStrategy:'2'])

    }
}

task assertConfigurations() << {
//    assert configurations.compile.dependencies.find {it.projectConfiguration == project.configurations.specialRuntime } //forventer at compile kjenner til 'special' artifakt
}

task assertClasspath() << {
    def sourceSet = project.convention.plugins.java.sourceSets.main

    assert sourceSet.runtimeClasspath.contains(configurations.specialRuntime.artifacts.files.singleFile)
    assert sourceSet.compileClasspath.contains(configurations.specialRuntime.artifacts.files.singleFile)


    //tester ved å eksekvere generert javaklient
    project.javaexec {
        main = 'Messenger'
        classpath = sourceSet.runtimeClasspath
        standardOutput = System.out
        errorOutput = System.err

        println "Excecuting javaprogram with classpath \n  = ${classpath.files.join(';\n += ')};"
    }.rethrowFailure()
}

task assertIdeaModule() << {
    def specialSourceSet = project.convention.plugins.java.sourceSets.special

    file("${project.name}.iml").text.with {

        if (strategy == '1') {

            assert it.contains("src/main/java")
            assert it.contains("gen/special/java") //forventer at generert source er markert som sourcekatalog

//            assert it.contains("src/special/resources")
            assert it.contains("build/resources/special") //forventer at generert resources er markert som sourcekatalog

        } else if (strategy == '2') {

            def specialClassesClassPath = project.relativePath(specialSourceSet.output.classesDir).replaceAll('\\\\', '/')
            assert it.contains("/${specialClassesClassPath}")    //forventer at sti for egenproduserte ressurser ligger på classpath

            def specialResourcesClassPath = project.relativePath(specialSourceSet.output.resourcesDir).replaceAll('\\\\', '/')
            assert it.contains("/${specialResourcesClassPath}")    //forventer at sti for egenproduserte classes ligger på classpath

            assert !it.contains("gen/special/java") //forventer at generert source IKKE er markert som sourcekatalog

        }

    }

}

task assertResources() << {
    def sourceSet = project.convention.plugins.java.sourceSets.special

    assert sourceSet.output.files.contains(file("${buildDir}/resources/special"))
    assert sourceSet.output.asFileTree.contains(file("${buildDir}/resources/special/myGeneratedResource.properties"))
}


task assertJavaSource() << {
    def sourceSet = project.convention.plugins.java.sourceSets.special

    assert sourceSet.allSource.srcDirs.contains(file('gen/special/java'))

    assert sourceSet.output.files.contains(file("${buildDir}/classes/special"))
    assert sourceSet.output.asFileTree.contains(file("${buildDir}/classes/special/Special.class"))
}


task printSourceSets() << {
    logger.info "SourceSets defined: "
    project.convention.plugins.java.sourceSets.each { s ->
        ['java', 'allJava', 'resources', 'filterResources', 'groovy', 'allGroovy', 'allSource'].each { id ->
            try {
                def prefix = "${s.name}.${id}"
                s."$id".srcDirs.each { println "$prefix <- ".padLeft(prefix.size() + 5, ' ') + project.relativePath(it); prefix = prefix.replaceAll(/./, ' ')  }
                println()
            } catch (MissingPropertyException mpe) {
                assert true //ok her
            }
        }
    }
}

/******************************************************************************************************************** **
 * Hjelpemetode for forking av gradle eksekveringer
 * Kun relevant for testing...
 ******************************************************************************************************************** */
void forkGradle(List tasks, Map props = [:]) {
    StartParameter sp = gradle.startParameter.newInstance()
    sp.taskNames = tasks.collect {"${project.path}:${it}".toString()}
    sp.projectProperties << props
    GradleLauncher.newInstance(sp).run().rethrowFailure();
}

