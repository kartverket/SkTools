//prosjekt spesifike settings

idea.project {
    jdkName = '1.6'
    languageLevel = '1.6'

    ipr.withXml { provider ->
        def rootNode = provider.asNode()

        /**
         * Eksempler og dokumentasjon på hvordan man kan benytte groovy xml og Node funksjonalitet
         * <br> http://groovy.codehaus.org/Reading+XML+using+Groovy%27s+XmlSlurper
         * <br> http://groovy.codehaus.org/Updating+XML+with+XmlSlurper
         */


        //legger til ant tasks
        rootNode.append(new XmlParser().parseText('''\
            <component name="AntConfiguration">
            <defaultAnt bundledAnt="true" />
            <buildFile url="file://$PROJECT_DIR$/intellij/build.xml">
              <additionalClassPath />
              <antReference projectDefault="true" />
              <customJdkName value="" />
              <maximumHeapSize value="32" />
              <maximumStackSize value="2" />
              <properties>
                <property name="GRADLE_HOME" value="''' + project.gradle.gradleHomeDir + '''" />
              </properties>
              <!--executeOn event="beforeCompilation" target="matrikkel.gen" /-->
            </buildFile>
            </component>
        '''))

    }
}


