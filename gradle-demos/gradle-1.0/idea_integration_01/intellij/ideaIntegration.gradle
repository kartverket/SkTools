import org.gradle.plugins.ide.idea.model.IdeaModule;

/**
 * Logikk for hvordan vi eksponerer ting i idea-prosjektet. 
 * Da IntelliJ (per 2010) ikke har mulighet til å holde flere konfigurasjoner/sourcesets per modul så må vi 
 * redusere disse til kun ett i InteliJ.
 */

//Finner ut av source kataloger og dependencies for IDEA
tasks.ideaModule.doFirst {

    def mainSourceSet = project.sourceSets.findByName("main")
    def testSourceSet = project.sourceSets.findByName("test")

    def wellKnownOutputdirs = [] as HashSet //outputkataloger i gradle for kildekode som blir markert som 'source' i IntelliJ
    wellKnownOutputdirs += mainSourceSet?.output?.classesDir
    wellKnownOutputdirs += testSourceSet?.output?.classesDir

    //finner source folders
    IdeaModule ideaModule = project.idea.module
    if (!mainSourceSet.is(null)) {
        ideaModule.sourceDirs -= mainSourceSet.resources.srcDirs
        ideaModule.sourceDirs += mainSourceSet.allJava.srcDirs
    }

    def ekstraCompileJars = [] as HashSet
    def ekstraRuntimeJars = [] as HashSet

    project.sourceSets.findAll {!['main', 'test'].contains(it.name)}.each {
        wellKnownOutputdirs += it.output.classesDir

        ideaModule.sourceDirs += it.java.srcDirs
        ideaModule.scopes.COMPILE.plus += project.configurations[it.compileConfigurationName]
        ideaModule.scopes.RUNTIME.minus += project.configurations[it.compileConfigurationName]
        ideaModule.scopes.RUNTIME.plus += project.configurations[it.runtimeConfigurationName]

        //putter på filer som evt ligger på *classpath men ikke dekkes av configurations
        //PS: ideaModule.singleEntryLibraries er av en ukjent grunn uggen (lar seg ikke legge til compile scope) - benytter derfor ekstra konfigurasjoner

        def providedJars = ideaModule.scopes.PROVIDED.plus.collectMany {it.files} - ideaModule.scopes.PROVIDED.minus.collectMany {it.files} + ideaModule.singleEntryLibraries.PROVIDED?.files
        def compileJars = ideaModule.scopes.COMPILE.plus.collectMany {it.files} - ideaModule.scopes.COMPILE.minus.collectMany {it.files} - ideaModule.singleEntryLibraries.COMPILE?.files - providedJars
        def runtimeJars = ideaModule.scopes.RUNTIME.plus.collectMany {it.files} - ideaModule.scopes.RUNTIME.minus.collectMany {it.files} - ideaModule.singleEntryLibraries.RUNTIME?.files - providedJars

        it.compileClasspath.files.each {
            if (!compileJars.contains(it)) ekstraCompileJars << it
        }

        it.runtimeClasspath.files.each {
            if (!runtimeJars.contains(it)) ekstraRuntimeJars << it
        }
    }

    ekstraCompileJars -= wellKnownOutputdirs //fjerner wellKnownOutputdirs da intellij kompilerer kildekoden for disse
    ekstraCompileJars -= project.sourceSets.collectMany { [it.output.classesDir, it.output.resourcesDir] + it.output.dirs.files} //fjerner alle outputkataloger for sourcesets da disse blir hektet inn via 'library' (se under)
    ekstraRuntimeJars -= wellKnownOutputdirs
    ekstraRuntimeJars -= project.sourceSets.collectMany { [it.output.classesDir, it.output.resourcesDir] + it.output.dirs.files}


    def extraCompileConfiguration = project.configurations.detachedConfiguration(project.dependencies.create(project.files(ekstraCompileJars)))
    def extraRuntimeConfiguration = project.configurations.detachedConfiguration(project.dependencies.create(project.files(ekstraRuntimeJars)))

    ideaModule.scopes.COMPILE.plus += extraCompileConfiguration
    ideaModule.scopes.RUNTIME.minus += extraCompileConfiguration
    ideaModule.scopes.RUNTIME.plus += extraRuntimeConfiguration

    //ideaModule.testSourceDirs //todo: evt legge inn test_manual?

    //linker inn resources og generert kode
    // gjøres på xml nivå da en her har full kontroll over class, source og scope
    ideaModule.iml {

        withXml { provider -> //legger til outputkataloger for resources og generert source som dependencies
            def rootNode = provider.asNode()

            def moduleManager = rootNode.component[0]

            //Legger til classes og sources for hvert sourceset. Oppretter et nytt 'library' for hvert sourceset.
            project.sourceSets.all { sourceSet ->

                def entry = moduleManager.appendNode('orderEntry', [type: 'module-library'])
                if (sourceSet.name != 'test') {
                    entry.attributes().put('exported', '')
                } else {
                    entry.attributes().put('scope', 'TEST')
                }
                def library = entry.appendNode('library', [name: "${project.path}:${sourceSet.name}[generated]"])

                //legger til classes
                def classes = library.appendNode('CLASSES')
                if (!wellKnownOutputdirs.contains(sourceSet.output.classesDir)) {
                    wellKnownOutputdirs += sourceSet.output.classesDir
                    classes.appendNode('root', [url: "file://\$MODULE_DIR\$/${project.relativePath(sourceSet.output.classesDir).replaceAll('\\\\', '/')}"])
                }
                if (!wellKnownOutputdirs.contains(sourceSet.output.resourcesDir)) {
                    wellKnownOutputdirs += sourceSet.output.resourcesDir
                    classes.appendNode('root', [url: "file://\$MODULE_DIR\$/${project.relativePath(sourceSet.output.resourcesDir).replaceAll('\\\\', '/')}"])
                }
                sourceSet.output.dirs.files.each {
                    if (!wellKnownOutputdirs.contains(it)) {
                        wellKnownOutputdirs += it
                        classes.appendNode('root', [url: "file://\$MODULE_DIR\$/${project.relativePath(it).replaceAll('\\\\', '/')}"])
                    }
                }

                def javadoc = library.appendNode('JAVADOC')

                //legger til sources (kildekode)
                def sources = library.appendNode('SOURCES')

                if (!['main', 'test'].contains(sourceSet.name)) { //dersom ikke kjent kildekode (java eller groovy)
                    ['java', 'groovy'].each {
                        try {
                            sourceSet."$it".srcDirs.each {
                                if (!ideaModule.sourceDirs.contains(it)) {  //IntelliJ blir forvirret dersom mappen både er markert som source OG som koblet kildekode for library
                                    sources.appendNode('root', [url: "file://\$MODULE_DIR\$/${project.relativePath(it).replaceAll('\\\\', '/')}"])
                                }
                            }
                        } catch (MissingPropertyException mpe) {
                            assert true //ok her
                        }
                    }
                }

                //alle resources og genererte resources
                ['resources'].each {
                    try {
                        sourceSet."$it".srcDirs.each {
                            if (!ideaModule.sourceDirs.contains(it)) {
                                sources.appendNode('root', [url: "file://\$MODULE_DIR\$/${project.relativePath(it).replaceAll('\\\\', '/')}"])
                            }
                        }
                    } catch (MissingPropertyException mpe) {
                        assert true //ok her
                    }
                }

                try {
                    sourceSet.'filterResourcesOutput'.each {
                        if (!ideaModule.sourceDirs.contains(it)) {
                            sources.appendNode('root', [url: "file://\$MODULE_DIR\$/${project.relativePath(it).replaceAll('\\\\', '/')}"])
                        }
                    }
                } catch (MissingPropertyException mpe) {
                    assert true //ok her
                }

            }


        }


        beforeMerged { module ->
            module.dependencies.clear() //skips merging of dependencies
            module.sourceFolders.clear()
        }
    }

}
