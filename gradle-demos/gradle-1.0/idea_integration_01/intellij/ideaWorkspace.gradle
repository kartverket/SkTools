//defaults for IntelliJ Workspace iws file
rootProject.idea.workspace.iws.withXml { provider ->
  def rootNode = provider.asNode()

  /**
   * Eksempler og dokumentasjon på hvordan man kan benytte groovy xml og Node funksjonalitet
   * <br> http://groovy.codehaus.org/Reading+XML+using+Groovy%27s+XmlSlurper
   * <br> http://groovy.codehaus.org/Updating+XML+with+XmlSlurper
   */
  def runManagerNode = rootNode.component.find { it.@name == 'RunManager'}.with { runManager ->

    //making sure no other none default configuration exists..
    runManager.configuration.findAll {it.'@default' == 'false' }.each {
      remove(it)
    }

    //default settings for Remote
    runManager.configuration.find { it.@type == 'Remote' && it.'@default' == 'true' }.with {
      it.option.find {it.@name == 'HOST'}.@value = 'localhost'
      it.option.find {it.@name == 'PORT'}.@value = '7009'
    }

    //default settings for Application
    runManager.configuration.find { it.@type == 'Application' && it.'@default' == 'true' }.with {
      it.option.find {it.@name == 'VM_PARAMETERS'}.@value = '-Xms256m -Xmx750m'
      it.option.find {it.@name == 'ENV_VARIABLES'}
    }

    //default settings for JUnit
    runManager.configuration.find { it.@type == 'JUnit' && it.'@default' == 'true' }.with {
      it.option.find {it.@name == 'VM_PARAMETERS'}.@value = '-Xms256m -Xmx750m'
      it.option.find {it.@name == 'TEST_OBJECT'}.@value = 'class'
      it.option.find {it.@name == 'ENV_VARIABLES'}
    }

    //default settings for WebApp
    runManager.configuration.find { it.@type == 'WebApp' && it.'@default' == 'true' }.with {
      it.Host[0].value = 'localhost'
      it.Port[0].value = '7002'
    }

    //default settings for TestNG
    runManager.configuration.find { it.@type == 'TestNG' && it.'@default' == 'true' }.with {
      if( it.is(null) ) {
        it = new XmlParser().parseText('''\
                <configuration default="true" type="TestNG" factoryName="TestNG">
                  <extension name="coverage" enabled="false" merge="false" runner="emma" />
                  <module name="" />
                  <option name="ALTERNATIVE_JRE_PATH_ENABLED" value="false" />
                  <option name="ALTERNATIVE_JRE_PATH" />
                  <option name="SUITE_NAME" />
                  <option name="PACKAGE_NAME" />
                  <option name="MAIN_CLASS_NAME" />
                  <option name="METHOD_NAME" />
                  <option name="GROUP_NAME" />
                  <option name="TEST_OBJECT" value="CLASS" />
                  <option name="VM_PARAMETERS" value="-Xms256m -Xmx750m" />
                  <option name="PARAMETERS" />
                  <option name="WORKING_DIRECTORY" />
                  <option name="OUTPUT_DIRECTORY" />
                  <option name="ANNOTATION_TYPE" />
                  <option name="ENV_VARIABLES" />
                  <option name="PASS_PARENT_ENVS" value="true" />
                  <option name="TEST_SEARCH_SCOPE">
                    <value defaultName="moduleWithDependencies" />
                  </option>
                  <option name="USE_DEFAULT_REPORTERS" value="false" />
                  <option name="PROPERTIES_FILE" />
                  <envs />
                  <properties />
                  <listeners />
                  <method>
                    <option name="BuildArtifacts" enabled="false" />
                    <option name="Make" enabled="true" />
                  </method>
                </configuration>
            ''')
        runManager.append(it)
      }
      it.option.find {it.@name == 'VM_PARAMETERS'}.@value = '-Xms256m -Xmx750m'
      it.option.find {it.@name == 'TEST_OBJECT'}.@value = 'CLASS'
      it.option.find {it.@name == 'ENV_VARIABLES'}
    }

    //todo: flytte denne til matrikkelklient der den natulig hører hjemme?
    //Application.Matrikkelklient
    runManager.append(new XmlParser().parseText('''\
            <configuration default="false" name="Matrikkelklient" type="Application" factoryName="Application">
              <extension name="coverage" enabled="false" merge="false" sample_coverage="true" runner="idea" />
              <option name="MAIN_CLASS_NAME" value="no.statkart.matrikkel.presentasjon.mainframe.MainFrameLauncher" />
              <option name="VM_PARAMETERS" value="-Xms256m -Xmx750m" />
              <option name="PROGRAM_PARAMETERS" value="" />
              <option name="WORKING_DIRECTORY" value="file://$PROJECT_DIR$" />
              <option name="ALTERNATIVE_JRE_PATH_ENABLED" value="false" />
              <option name="ALTERNATIVE_JRE_PATH" value="" />
              <option name="ENABLE_SWING_INSPECTOR" value="false" />
              <option name="ENV_VARIABLES" />
              <option name="PASS_PARENT_ENVS" value="true" />
              <module name="matrikkelklient" />
              <envs />
              <RunnerSettings RunnerId="Debug">
                <option name="DEBUG_PORT" value="1587" />
                <option name="TRANSPORT" value="0" />
                <option name="LOCAL" value="true" />
              </RunnerSettings>
              <RunnerSettings RunnerId="Run" />
              <ConfigurationWrapper RunnerId="Debug" />
              <ConfigurationWrapper RunnerId="Run" />
              <method />
            </configuration>
        '''))
    //setter denne som selected
    runManager.@selected = runManager.configuration.last().@type + '.' + runManager.configuration.last().@name

    //todo: flytte denne til main/jobbserver der den naturlig hører hjemme?
    //Application.Jobbserver
    runManager.append(new XmlParser().parseText('''\
            <configuration default="false" name="Jobbserver" type="Application" factoryName="Application">
              <extension name="coverage" enabled="false" merge="false" runner="emma" />
              <option name="MAIN_CLASS_NAME" value="no.statkart.matrikkel.service.jobb.JobbServer" />
              <option name="VM_PARAMETERS" value="-Xms256m -Xmx750m" />
              <option name="PROGRAM_PARAMETERS" value="''' + System.getenv('USERNAME') + ''' ALL" />
              <option name="WORKING_DIRECTORY" value="file://$PROJECT_DIR$" />
              <option name="ALTERNATIVE_JRE_PATH_ENABLED" value="false" />
              <option name="ALTERNATIVE_JRE_PATH" value="" />
              <option name="ENABLE_SWING_INSPECTOR" value="false" />
              <option name="ENV_VARIABLES" />
              <option name="PASS_PARENT_ENVS" value="true" />
              <module name="main" />
              <envs />
              <RunnerSettings RunnerId="Debug">
                <option name="DEBUG_PORT" value="2890" />
                <option name="TRANSPORT" value="0" />
                <option name="LOCAL" value="true" />
              </RunnerSettings>
              <RunnerSettings RunnerId="Run" />
              <ConfigurationWrapper RunnerId="Debug" />
              <ConfigurationWrapper RunnerId="Run" />
              <method />
            </configuration>
        '''))

    //todo: flytte denne til main/server der den naturlig hører hjemme?
    //Remote.Releasetest:7001
    runManager.append(new XmlParser().parseText('''\
            <configuration default="false" name="Releasetest:7001" type="Remote" factoryName="Remote">
              <option name="USE_SOCKET_TRANSPORT" value="true" />
              <option name="SERVER_MODE" value="false" />
              <option name="SHMEM_ADDRESS" value="javadebug" />
              <option name="HOST" value="skrivap24" />
              <option name="PORT" value="7009" />
              <RunnerSettings RunnerId="Debug">
                <option name="DEBUG_PORT" value="7009" />
                <option name="TRANSPORT" value="0" />
                <option name="LOCAL" value="false" />
              </RunnerSettings>
              <ConfigurationWrapper RunnerId="Debug" />
              <method />
            </configuration>
        '''))

    //todo: flytte denne til main/server der den naturlig hører hjemme?
    //Remote.Localhost:7001
    runManager.append(new XmlParser().parseText('''\
            <configuration default="false" name="Localhost:7001" type="Remote" factoryName="Remote">
              <option name="USE_SOCKET_TRANSPORT" value="true" />
              <option name="SERVER_MODE" value="false" />
              <option name="SHMEM_ADDRESS" value="javadebug" />
              <option name="HOST" value="localhost" />
              <option name="PORT" value="7009" />
              <RunnerSettings RunnerId="Debug">
                <option name="DEBUG_PORT" value="7009" />
                <option name="TRANSPORT" value="0" />
                <option name="LOCAL" value="false" />
              </RunnerSettings>
              <ConfigurationWrapper RunnerId="Debug" />
              <method />
            </configuration>
        '''))

    //oppretter liste over konfigurasjoner
    //listen er på formen:
    //<list size="2">
    //  <item index="0" class="java.lang.String" itemvalue="Application.Matrikkelklient" />
    //  <item index="1" class="java.lang.String" itemvalue="Application.Jobbserver" />
    //</list>
    appendNode('list').with { list ->
      int i = 0
      runManager.configuration.findAll { it.'@default' == 'false' }.each {
        list.appendNode('item', [index: i++, class: 'java.lang.String', itemvalue: "${it.@type}.${it.@name}"])
      }
      list.@size = i
    }

  }//end <component name='RunManager'>

}