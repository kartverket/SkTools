
defaultTasks 'runDemos'

task runDemos(type: GradleBuild) {

    tasks = ['runDemos']

    doFirst {
        if (gradle.gradleVersion > '1.0') {
//            startParameter.currentDir = project.file('gradle-1.0')
            dir = project.file('gradle-1.0')
        } else {
            println "Ingen demoer finnes for Gradle version [${gradle.gradleVersion}]"
        }

    }

}

