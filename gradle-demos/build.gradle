
defaultTasks 'runDemos'

task runDemos << {

    StartParameter sp = gradle.startParameter.newInstance()

    if (gradle.gradleVersion > '1.0') {
        sp.currentDir = project.file('gradle-1.0')
    } else {
        println "Ingen demoer finnes for Gradle version [${gradle.gradleVersion}]"
    }

    sp.taskNames = ['runDemos']
    GradleLauncher.newInstance(sp).run().rethrowFailure();

}

