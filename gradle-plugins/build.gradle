apply plugin: 'java'
apply plugin: 'maven'

group = 'no.statkart.sktools.gradle'



dependencies {

    //'samlepom' av samtlige plugins [SKIF-154]
    project.childProjects.values().each {
        runtime it
    }
}



tasks.test.dependsOn('testDemos')

//closure som collecter alle demo-prosjekter som evt måtte finnes
groovy.lang.Closure findDemoDirs = { project ->
    return project.childProjects.values().collectMany { Project childProject ->
        File demoDir = childProject.file("demos")
        if (!demoDir.exists()) println "..no demo found for ${childProject.getPath()}"
        return demoDir.exists() ? [[demoDir, childProject]] : []
    }
}

//task som eksekverer alle demo-prosjekter som evt måtte finnes
task('testDemos', dependsOn:'cleanDemos') {


    //kjøring av tester før kjøring av demos
    if (project.gradle.startParameter.taskNames.contains('test')) {
        //adding depends on makes the demos run last
        project.childProjects.values().each { Project childProject ->
            dependsOn("${childProject.path}:test")
        }
    }


    doLast {
        println 'Running demos..'
        int i=0
        findDemoDirs(project).each { values ->
            i++
            println '..executing demo in ' + project.relativePath(values[0])
            StartParameter sp = new StartParameter()
            sp.setCurrentDir(values[0])
//                sp.setTaskNames(['clean', 'runDemo'])
            sp.setTaskNames(['runDemo'])
            sp.projectProperties.put('sktools_versjon', values[1].version)
            sp.projectProperties.put('MAVEN_REPO', MAVEN_REPO)
            GradleLauncher.newInstance(sp).run().rethrowFailure();
        }
        println "\n${i} demos executed!"
    }
}

//task som cleaner demo-prosjekter som evt måtte finnes
task('cleanDemos') { Task me ->

    // Vi må installere alle artefakter før noe kan kjøres på demoene, inkludert clean
    gradle.projectsEvaluated {
        me.dependsOn rootProject.getTasksByName('install', true)
    }


    doLast {
        println 'Cleaning demos..'
        findDemoDirs(project).each { values ->
            println '..cleaning demo ' + project.relativePath(values[0])
            StartParameter sp = new StartParameter()
            sp.setCurrentDir(values[0])
            sp.setTaskNames(['clean'])
            sp.projectProperties.put('sktools_versjon', values[1].version)
            GradleLauncher.newInstance(sp).run().rethrowFailure();
        }
    }
}

