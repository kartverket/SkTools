apply plugin: 'java'
apply plugin: 'maven'

group = 'no.statkart.sktools.gradle'



dependencies {

    //'samlepom' av samtlige plugins [SKIF-154]
    project.childProjects.values().each {
        runtime it
    }
}



//closure som collecter alle demo-prosjekter som evt måtte finnes
groovy.lang.Closure findDemoDirs = { project ->
    return project.childProjects.values().collectMany { Project childProject ->
        File demoDir = childProject.file("demos")
        if (!demoDir.exists()) println "..no demo found for ${childProject.getPath()}"
        return demoDir.exists() ? [[demoDir, childProject]] : []
    }
}


//task som eksekverer alle demo-prosjekter som evt måtte finnes
task('testDemos') {
    project.tasks['test'].dependsOn it //part of test

    final demoDirData = findDemoDirs(project)

    demoDirData.eachWithIndex { def values, int demoCount ->

        def demoTask = project.task("cleanDemo$demoCount", type: GradleBuild) {
            tasks = ['clean', 'runDemo']
            doFirst {
                println('################################################################################');
                println '## starting demo in ' + project.relativePath(dir)
            }
            doLast {
                println "\n  ...end of demo ${name}"
                println('################################################################################\n\n');
            }
        }

        [demoTask].each { def task ->
            task.dir = values[0]
            task.startParameter.projectProperties = [sktools_versjon: "${values[1].version}", MAVEN_REPO: MAVEN_REPO, WEBLOGIC_HOME: WEBLOGIC_HOME]
            task.startParameter.systemPropertiesArgs = [noMavenBootstrap: 'true'];
            task.outputs.upToDateWhen { false } //always run this...
        }

        gradle.projectsEvaluated {
            // Vi må installere alle artefakter før demoer kjøres
            demoTask.dependsOn rootProject.getTasksByName('install', true)

            // kjøring av tester før kjøring av demos
            demoTask.dependsOn project.subprojects.collectNested { it.getTasksByName('test', true) }

            //dependsOn demoTask
            dependsOn demoTask
        }
    }
    
    doLast {
        println "\n...${demoDirData.size()} demos executed!"
    }
}
