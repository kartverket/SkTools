apply plugin: 'java'
apply plugin: 'maven'

group = 'no.statkart.sktools.gradle'



dependencies {

    //'samlepom' av samtlige plugins [SKIF-154]
    project.childProjects.values().each {
        runtime it
    }
}



//closure som collecter alle demo-prosjekter som evt måtte finnes
groovy.lang.Closure findDemoDirs = { project ->
    return project.childProjects.values().collectMany { Project childProject ->
        File demoDir = childProject.file("demos")
        if (!demoDir.exists()) println "..no demo found for ${childProject.getPath()}"
        return demoDir.exists() ? [[demoDir, childProject]] : []
    }
}


//task som eksekverer alle demo-prosjekter som evt måtte finnes
task('testDemos') {
    project.tasks['test'].dependsOn it //part of test
    
    
    int demoCount
    findDemoDirs(project).each { values ->
        demoCount++

        def cleanDemoTask = project.task("cleanDemo$demoCount", type: GradleBuild) {
            dir = values[0]
            tasks = ['clean']
            startParameter.projectProperties = [sktools_versjon: "${values[1].version}", MAVEN_REPO: MAVEN_REPO]
            startParameter.systemPropertiesArgs = [noMavenBootstrap: 'true']
            doFirst {
                println('################################################################################');
                println '## cleaning demo in ' + project.relativePath(dir)
            }
            doLast {
                println "\n  ...end of demo ${name}"
                println('################################################################################\n\n');
            }
            outputs.upToDateWhen { false } //always run this...
        }

        def runDemoTask = project.task("runDemo$demoCount", type: GradleBuild, dependsOn:cleanDemoTask) {
            dir = values[0]
            tasks = ['runDemo']

            startParameter.projectProperties = [sktools_versjon: "${values[1].version}", MAVEN_REPO: MAVEN_REPO]
            startParameter.systemPropertiesArgs = [noMavenBootstrap: 'true']
            doFirst {
                println('################################################################################');
                println '## executing demo in ' + project.relativePath(dir)
            }
            doLast {
                println "\n  ...end of demo ${name}"
                println('################################################################################\n\n');
            }
            outputs.upToDateWhen { false } //always run this...
        }

        gradle.projectsEvaluated {

            // Vi må installere alle artefakter før noe kan kjøres på demoene, inkludert clean
            cleanDemoTask.dependsOn rootProject.getTasksByName('install', true)

            //kjøring av tester før kjøring av demos
            if (project.gradle.startParameter.taskNames.contains('test')) {
                //adding depends on makes the demos run last
                runDemoTask.dependsOn project.getTasksByName('test', true)
            }

        }

        dependsOn runDemoTask
    }
    
    doLast {
        println "\n...${demoCount} demos executed!"
    }
}



