apply plugin: 'java'
apply plugin: 'maven'

group = 'no.statkart.sktools.gradle'



dependencies {
    //'samlepom' av samtlige plugins [SKTOOLS-13]
    runtime project.childProjects.values()
}


def demosExecuted = 0

//task som eksekverer alle demo-prosjekter som evt måtte finnes
final def testAllDemos = task('testDemos') {
    mustRunAfter project.tasks.test //part of test
    doLast {
        logger.lifecycle "\n...${demosExecuted} demos executed!"
    }
}

Closure setUpDemoTestingFor = { final Project pluginProject, final File demoDir ->
        def cleanDemoTask = pluginProject.task('cleanDemos', type: GradleBuild) {
            println "pluginProject: ${pluginProject.path} dir: ${demoDir}"
            dir = demoDir
            tasks = ['clean']
            dependsOn rootProject.getTasksByName('install', true) // Vi må installere alle artefakter før demoer kjøres

            doFirst {
                logger.quiet '################################################################################'
                logger.quiet "## cleaning demo in ${rootProject.relativePath(dir)}"
            }
            doLast {
                logger.quiet "\n  ...end of clean ${name}"
                logger.quiet '################################################################################\n\n'
            }
        }

        def runDemoTask = pluginProject.task('runDemo', type: GradleBuild, dependsOn: cleanDemoTask) {
            dir = demoDir
            tasks = ['runDemo']

            doFirst {
                logger.quiet '################################################################################'
                logger.quiet "## executing demo in ${rootProject.relativePath(dir)}"
                demosExecuted++
            }
            doLast {
                logger.quiet "\n  ...end of demo ${name}"
                logger.quiet '################################################################################\n\n'
            }
        }

        [cleanDemoTask, runDemoTask].each { def task ->
            task.startParameter.projectProperties = [sktools_versjon: "${pluginProject.version}", MAVEN_REPO: MAVEN_REPO, WEBLOGIC_HOME: WEBLOGIC_HOME]
            task.startParameter.systemPropertiesArgs = [noMavenBootstrap: 'true'];
            task.outputs.upToDateWhen { false } //always run this...
            task.shouldRunAfter pluginProject.tasks.test //kjøring av (optional) test før kjøring av demos
        }

        return runDemoTask
}

evaluationDependsOnChildren()
subprojects { Project childProject ->
    File demoDir = childProject.file("demos")
    if (demoDir.exists()) {
        logger.quiet "..demo found for ${childProject.getPath()}"

        childProject.task('testDemos') {
            dependsOn setUpDemoTestingFor(childProject, demoDir)
            mustRunAfter childProject.tasks.test //part of test
        }

        testAllDemos.dependsOn childProject.tasks.testDemos
    } else {
        logger.warn "..no demo found for ${childProject.getPath()}"
    }
}


