plugins {
    id 'java'
    id 'maven-publish'
}

group = 'no.statkart.sktools.gradle'



dependencies {
    //'samlepom' av samtlige plugins [SKTOOLS-13]
    apiElements project.childProjects.values()
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}


