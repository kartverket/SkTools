plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'no.statkart.sktools.gradle'

afterEvaluate { //depends on children...
    dependencies {
        //'samlepom' av samtlige plugins [SKTOOLS-13]
        api project.childProjects.values()
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/kartverket/sktools"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
