apply plugin: 'java'
apply plugin: 'maven'

group = 'no.statkart.sktools.gradle'



dependencies {
    //'samlepom' av samtlige plugins [SKTOOLS-13]
    runtime project.childProjects.values()
}


task demoConfig() {
    File propertyFile = file("${buildDir}/demo/gradle.properties")
    //registerer output-filer for denne tasken
    outputs.files propertyFile
    doFirst {
        logger.info "writing to $propertyFile"
        propertyFile.parentFile.mkdirs()
        def props = ['version': version /* bestemmer sktools versjon for demo context */] as Properties
        props.store(new PrintWriter(propertyFile, "UTF-8"), "generated ${new Date()}")
    }
    inputs.property 'version', version
}

task zipDemos(description: 'Pakker sammen alle demoer for releasetesting', type: Zip) {
    classifier = 'demos'

    from 'src/demos'
    from tasks.demoConfig

    project.childProjects.each { name, p ->
        def demoDir = p.file('demos')
        if (demoDir) {
            into name, {
                from demoDir
                exclude '**/.gradle/**', '**/build/**', '**/gen/**'
            }
        }
    }
}

artifacts {
    archives zipDemos
}


