plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

group = 'no.statkart.sktools.gradle'

java {
    withSourcesJar()
}

gradlePlugin {
    plugins {
        wsdlCustomizer {
            id = 'sktools.wsdl-customizer'
            implementationClass = 'no.statkart.sktools.gradle.plugins.wsdlcustomizer.WsdlCustomizerPlugin'
        }
    }
}

dependencies {
    testImplementation project(':build-utils:test-utils')
}
