apply plugin: 'sktools-dbtools-plugin'


configurations {
    drivers
}

dependencies {
    drivers "com.oracle:ojdbc6:11.2.0.2.0@jar"
}




//see DbtoolsConvention#ConfigureDatabasePlugin
configureDatabasePlugin {


    useDrivers configurations.drivers

    useToolset('oracle', '', 'main/sql') {

        //mandatory, required property
        project.setProperty 'oracle_db_host', 'localhost'
        project.setProperty 'oracle_db_port', '1521'
        project.setProperty 'oracle_db_sid', '<YOUR_SID>'


        url = "jdbc:oracle:thin:@${project.property('oracle_db_host')}:${project.property('oracle_db_port')}:${project.property('oracle_db_sid')}"
    }

}
