apply plugin: 'sktools-dbtools-plugin'


def libraries = [
        drivers: ["com.oracle:ojdbc6:11.2.0.4.0@jar"]
]

ext.username = 'BRUKER1'
ext.password = 'BRUKER1'

//mandatory, required values for project
project.ext.set 'oracle_db_host', 'localhost'
project.ext.set 'oracle_db_port', '1521'
project.ext.set 'oracle_db_sid', '<YOUR_SID>'

/**
 * SKTOOLS-32
 * Demonstrerer angivelse av filtrerte properties for toolset
 */


configureDatabasePlugin {

    useDrivers libraries.drivers

    toolset( name:'main', type:'oracle', prefix:'') {

        //SKTOOLS-32
        assert properties['dynamic'] == null //ikke satt enda


        sqlTask('CustomTask', sqlString: 'select 1 from dual') {
//            doFirst {
                toolset.properties['dynamic'] = 'CustomTaskValue'
//            }
        }

        url = "jdbc:oracle:thin:@${project.ext.oracle_db_host}:${project.ext.oracle_db_port}:${project.ext.oracle_db_sid}"

        //SKTOOLS-32
        assert properties['dynamic'] == 'CustomTaskValue' //som satt over

        properties = [
                dynamic: 'initialValue',

                username: project.username,
                password: project.password,
        ]

        //SKTOOLS-32
        assert properties['dynamic'] == 'initialValue' //som satt over


        //SKTOOLS-32
        sqlTask('CustomTask2', sqlString: 'select 1 from dual') {
            toolset.properties['dynamic'] = 'CustomTask2Value'
        }
        assert properties['dynamic'] == 'CustomTask2Value' //som satt over



    }

}


