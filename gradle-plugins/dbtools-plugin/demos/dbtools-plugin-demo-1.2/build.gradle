group = 'no.statkart.sktools.gradle.plugins.dbtools-plugin.demos'


assert gradle.gradleVersion == '1.0' || gradle.gradleVersion >= '1.0-rc-2'

buildscript {
    def version = rootProject.getProperty('version')
    if (version == Project.DEFAULT_VERSION) version = '1.2-SNAPSHOT' //nb - dersom ikke default version er satt riktig så blir kjøring ifra demo-katalog feil..

    // Variables to grab from environment + defaults
    ['COMPUTERNAME', 'MAVEN_REPO', 'JAVA_HOME'].each { val ->
        if (!rootProject.ext.has(val) && System.getenv(val) != null) {
            rootProject.ext.set(val, System.getenv(val))
        }
    }
    project.ext.set('MAVEN_REPO', project.ext.properties.get('MAVEN_REPO', 'http://skrivap92.statkart.no:8001/nexus/content/groups/public/'))

    repositories {
        //bruker kun lokale filer her da dette er et demo prosjekt...
        mavenLocal()
        mavenRepo name: 'public', url: MAVEN_REPO
    }

    dependencies {
        classpath "no.statkart.sktools.gradle:dbtools-plugin:${version}"
    }
}

allprojects {
    repositories {
        mavenRepo name: 'public', url: "${rootProject.MAVEN_REPO}"
        mavenLocal()
    }
}



//intellij
allprojects {
    apply plugin: 'java'    //trenger denne for at scopes.PROVIDED.plus skal fungere i idea plugin konfigurasjon
    apply plugin: 'idea'
}


project.idea.module {
    //legger til denne for innkobling av dokumentasjon i Intellij osv
    scopes.PROVIDED.plus += buildscript.configurations.classpath
}
