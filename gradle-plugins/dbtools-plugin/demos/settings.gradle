include ':simpledemo'
include ':multiple_toolsets'
include ':encoding'
include ':properties'
include ':patch'
include ':patch:multimodule'
//include ':exhaustion'

rootProject.name = 'dbtools-plugin-demos'



//automatisk re-compile og install av siste versjon av plugin til lokal maven (spesifikt for demo-prosjekt)
gradle.projectsLoaded { Gradle g ->
    //dersom ikke nested bygg..
    if (g.parent == null) {
        if (!startParameter.taskNames.isEmpty()) {
            g.rootProject.buildscript {
                StartParameter sp = gradle.startParameter.newBuild()
                sp.taskNames = ['install']
                sp.projectDir = g.rootProject.file('../../..') //install på rotprosjektet da en har dependency til db-tools

                println 'Asserting project is up to date. Running build on root-project:'
                GradleLauncher.newInstance(sp).run().rethrowFailure();
            }
        }
    }
}
