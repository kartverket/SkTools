plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

group = 'no.statkart.sktools.gradle'



dependencies {
    implementation project(':build-utils:db-tools')
    implementation project(':build-utils:sql-parser') //pga SqlExecutor

    testImplementation project(':build-utils:test-utils')
    testImplementation libraries.hsqldb
}

task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    classifier "sources"
}

publishing {
    publications.all {
        artifact sourceJar
    }
}


