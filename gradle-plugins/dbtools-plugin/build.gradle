plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

group = 'no.statkart.sktools.gradle'

java {
    withSourcesJar()
}


publishing {
    publications {
        pluginMaven(MavenPublication) {
            artifactId = 'dbtools-plugin'
        }
    }
}


gradlePlugin {
    plugins {
        dbtools {
            id = 'sktools.dbtools'
            implementationClass = 'no.statkart.sktools.gradle.plugins.dbtools.database.DbtoolsPlugin'
        }
    }
}

def pluginPropertiesDir = "$buildDir/plugin-properties"
def pluginProperties = [
    sktools_dbtools : "no.statkart.sktools:db-tools:${version}" as String,
] as Properties

dependencies {
    implementation project(':build-utils:db-tools')
    implementation project(':build-utils:sql-parser') //pga SqlExecutor
    implementation libraries.groovy_sql

    testImplementation project(':build-utils:test-utils')
    testImplementation libraries.hsqldb
}


// inject av verktøy i testkjøring
tasks.register('testProperties') {
    def outputDir = file("$buildDir/$name")
    def dbToolsClasspath = project(':build-utils:db-tools').sourceSets.main.runtimeClasspath

    inputs.files dbToolsClasspath
    outputs.dir outputDir

    doLast {
        def properties = [
            sktools_dbtools_classpath: dbToolsClasspath.asPath,
            libraries_hsqldb         : libraries.hsqldb,
        ]
        outputDir.mkdirs()
        file("$outputDir/DbtoolsPluginTest.properties").withWriter {
            (properties as Properties).store(it, (String) null)
        }
    }
}
pluginUnderTestMetadata.pluginClasspath.from files(testProperties)
pluginUnderTestMetadata.pluginClasspath.from sourceSets.main.output
sourceSets.test.resources.srcDir testProperties

tasks.register('createPluginProperties') {
    outputs.dir pluginPropertiesDir
    inputs.properties pluginProperties
    doLast {
        def file = layout.projectDirectory.file("$pluginPropertiesDir/no/statkart/sktools/dbtools-gradle-plugin.properties").asFile
        file.parentFile.mkdirs()
        file.withWriter {
            pluginProperties.store(it, (String) null)
        }
        logger.info "Created plugin info file: ${file.getAbsolutePath()}"
    }
}
sourceSets.main.resources.srcDir createPluginProperties
