apply plugin: 'sktools-ideaextensions-plugin'
apply plugin: 'groovy'

sourceCompatibility = '1.6'
targetCompatibility = '1.6'

/**
 * Tester at filer blir maksert vekk
 * Tester at Perforce blir koblet inn som vcs
 */
ideaExtensions {
    ignoreMasks += '*.tmp'
    vcs 'Perforce'
    inspectionProfile = 'inspections.xml'
    codeStyle = 'codestyle.xml'
}


tasks.idea.dependsOn task('genSpamfiler') {
    project.file('config').mkdirs()
    project.file('config/myconfig.tmp').createNewFile()
    project.file('config/myconfig2.properties').createNewFile()
    project.file('gradle.log').createNewFile()

}

tasks.clean.dependsOn 'cleanIdea' //cleans out generated idea files

task runDemo() {
    dependsOn 'testMasks'
    dependsOn 'testVCS'
    dependsOn 'testInspections'
    dependsOn 'testCodeStyle'
}


task testMasks(dependsOn:'idea') << {
    assert file("${project.name}.iws").text.contains('mask="*.tmp"')
}

task testVCS(dependsOn:'idea') << {
    assert file("${project.name}.ipr").text.contains('vcs="Perforce"')
}

task testInspections(dependsOn:'idea') << {
    assert file("${project.name}.ipr").text.contains('"SKTools Default"')
}

task testCodeStyle(dependsOn:'idea') << {
    assert file("${project.name}.ipr").text.contains('"XML_ATTRIBUTE_WRAP"')
}