include ':foldergeneration'


rootProject.name = 'ideaextensions-demo'




//automatisk re-compile og install av siste versjon av plugin til lokal maven (spesifikt for demo-prosjekt)
gradle.projectsLoaded { Gradle g ->
    //if nested build...
    if (g.startParameter.systemPropertiesArgs['noMavenBootstrap']) {
        logger.info "Skipping maven install doe to -DnoMavenBootstrap=${g.startParameter.systemPropertiesArgs['noMavenBootstrap']}"
    } else {
        logger.quiet 'Asserting project is up to date. Running gradle deamon on root-project...'

        File projectDir = g.rootProject.file('..')
        org.gradle.tooling.ProjectConnection connection = org.gradle.tooling.GradleConnector.newConnector().forProjectDirectory(projectDir).connect()
        try {
            connection.newBuild().forTasks('install').run()
        } finally {
            connection.close()
            logger.quiet '...deamon done.'
        }
    }
}

