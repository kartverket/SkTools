plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

group = 'no.statkart.sktools.gradle'

java {
    withSourcesJar()
}

publishing {
    publications {
        pluginMaven(MavenPublication) {
            artifactId = 'wsimport-plugin'
        }
    }
}


gradlePlugin {
    plugins {
        wsimport {
            id = 'sktools.wsimport'
            implementationClass = 'no.statkart.sktools.gradle.plugins.wsimport.WsImportPlugin'
        }
    }
}


dependencies {
    testImplementation project(':build-utils:test-utils')
}
