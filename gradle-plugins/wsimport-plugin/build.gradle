plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

group = 'no.statkart.sktools.gradle'

gradlePlugin {
    plugins {
        wsimport {
            id = 'sktools.wsimport'
            implementationClass = 'no.statkart.sktools.gradle.plugins.wsimport.WsImportPlugin'
        }
    }
}


dependencies {
    testImplementation project(':build-utils:test-utils')
}

task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    classifier 'sources'
}

publishing {
    publications.matching { it.name == 'pluginMaven' }.each {
        artifact sourceJar
    }
}
