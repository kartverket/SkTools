group = 'no.statkart.sktools.gradle.plugins.filterproperties-plugin.demos'


assert gradle.gradleVersion == '1.0' || gradle.gradleVersion >= '1.0-rc-2'

//innkobling av plugin jar filer for gradle byggesystem
buildscript {
    project.version = rootProject.getProperty('version')
    if (project.version == Project.DEFAULT_VERSION) project.version = '1.2-SNAPSHOT' //nb - dersom ikke default version er satt riktig så blir kjøring ifra demo-katalog feil..

    // Variables to grab from environment + defaults
    ['WEBLOGIC_HOME', 'COMPUTERNAME', 'PUBLIC_REPO', 'JAVA_HOME'].each { val ->
        if (!rootProject.ext.has(val) && System.getenv(val) != null) {
            rootProject.ext.set(val, System.getenv(val))
        }
    }

    project.ext.set('PUBLIC_REPO', project.ext.properties.get('PUBLIC_REPO', 'http://skrivap92.statkart.no:8001/nexus/content/groups/public/'))

    repositories {
        //bruker kun lokale filer her da dette er et demo prosjekt...
        mavenLocal()

        mavenRepo name: 'public', url: PUBLIC_REPO

    }

    dependencies {
        classpath "no.statkart.sktools.gradle:filterproperties-plugin:${version}"
    }

}
