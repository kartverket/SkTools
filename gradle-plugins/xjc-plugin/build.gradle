//        }
//    }
//}

def pluginPropertiesDir = "$buildDir/plugin-properties"
def pluginProperties = [
        default_xjc_implementation : 'org.glassfish.jaxb:jaxb-xjc:3.0.2',
        default_jaxb_ri_implementation : 'org.glassfish.jaxb:jaxb-runtime:3.0.2',
] as Properties

dependencies {
    testImplementation project(':build-utils:test-utils')
}

pluginUnderTestMetadata.pluginClasspath.from sourceSets.main.output


task createPluginProperties() {
    outputs.dir pluginPropertiesDir
    inputs.properties pluginProperties
    doLast {
        def file = project.file("$pluginPropertiesDir/no/statkart/sktools/xjc-gradle-plugin.properties")
        file.parentFile.mkdirs()
        org.gradle.util.GUtil.saveProperties(pluginProperties, file)
        logger.info "Created plugin info file: ${file.getAbsolutePath()}"
    }
}
sourceSets.main.resources.srcDir createPluginProperties
