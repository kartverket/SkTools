plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

group = 'no.statkart.sktools.gradle'

gradlePlugin {
    plugins {
        xjc {
            id = 'sktools.xjc'
            implementationClass = 'no.statkart.sktools.gradle.plugins.xjc.XjcPlugin'
        }
    }
}

def pluginPropertiesDir = "$buildDir/plugin-properties"
def pluginProperties = [
        sktools_xjc_extensions : "no.statkart.sktools:xjc-plugins:${version}" as String,
        default_xjc_implementation : libraries.jaxb_xjc as String,
        default_jaxb_ri_implementation : libraries.jaxb_rt as String,
] as Properties

dependencies {
    testImplementation project(':build-utils:test-utils')
}

// inject av verktøy i testkjøring
task testProperties {
    def outputDir = file("$buildDir/$name")

    def configuration = project.configurations.detachedConfiguration(project.dependencies.project(path: ':build-utils:xjc-plugins'))
    inputs.files configuration
    outputs.dir outputDir

    doLast {
        def properties = [
            sktools_xjc_classpath: configuration.asPath
        ]
        outputDir.mkdirs()
        org.gradle.util.GUtil.saveProperties(properties as Properties, file("$outputDir/XjcPluginTest.properties"))
    }
}
pluginUnderTestMetadata.pluginClasspath.from files(testProperties)
pluginUnderTestMetadata.pluginClasspath.from sourceSets.main.output


task createPluginProperties() {
    outputs.dir pluginPropertiesDir
    inputs.properties pluginProperties
    doLast {
        def file = project.file("$pluginPropertiesDir/no/statkart/sktools/xjc-gradle-plugin.properties")
        file.parentFile.mkdirs()
        org.gradle.util.GUtil.saveProperties(pluginProperties, file)
        logger.info "Created plugin info file: ${file.getAbsolutePath()}"
    }
}
sourceSets.main.resources.srcDir createPluginProperties


task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    classifier 'sources'
}

publishing {
    publications.all {
        if (it.name == 'pluginMaven') artifact sourceJar
    }
}
