plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

group = 'no.statkart.sktools.gradle'



dependencies {
    compileOnly gradleApi()

    testImplementation project(':build-utils:test-utils')
}



gradlePlugin {
    plugins {
        propertiesPlugin {
            id = 'sktools-properties-plugin'
            implementationClass = 'no.statkart.sktools.gradle.plugins.properties.PropertiesPlugin'
        }
    }
}


task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    classifier 'sources'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourceJar
        }
    }
}


