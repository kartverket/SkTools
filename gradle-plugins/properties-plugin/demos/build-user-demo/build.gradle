apply plugin: 'sktools-properties-plugin'

propertyUtils.with {
    assignPropertiesToProject fromFile('build-user.properties')
}


task runDemo() {
    doLast {
        assert project.properties.expandedValue == '${testValue} ${testValue}'

        propertyUtils.expandProjectProperties()

        assert project.properties.expandedValue == 'myValue myValue'
    }
}


