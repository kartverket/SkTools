plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

group = 'no.statkart.sktools.gradle'

gradlePlugin {
    plugins {
        wsdoc {
            id = 'sktools.wsdoc'
            implementationClass = 'no.statkart.sktools.gradle.plugins.wsdocgen.WsDocGenPlugin'
        }
    }
}

def pluginPropertiesDir = "$buildDir/plugin-properties"
sourceSets {
    main {
        output.dir(pluginPropertiesDir, builtBy: 'createPluginProperties')
    }
}

def pluginProperties = [
    sktools_wsdocgen : "no.statkart.sktools:wsdocgen:${version}" as String,
] as Properties

dependencies {
    testImplementation project(':build-utils:test-utils')
}

pluginUnderTestMetadata.doFirst {
    pluginUnderTestMetadata.pluginClasspath.from project(':build-utils:wsdocgen').sourceSets.main.runtimeClasspath
    pluginUnderTestMetadata.pluginClasspath.from outputDirectory
}

task createPluginProperties() {
    outputs.dir pluginPropertiesDir
    inputs.properties pluginProperties
    doLast {
        def file = project.file("$pluginPropertiesDir/no/statkart/sktools/wsdocgen-gradle-plugin.properties")
        file.parentFile.mkdirs()
        org.gradle.util.GUtil.saveProperties(pluginProperties, file)
        logger.info "Created plugin info file: ${file.getAbsolutePath()}"
    }
}
tasks.processResources.dependsOn createPluginProperties


task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    classifier 'sources'
}

publishing {
    publications.all {
        if (it.name == 'pluginMaven') artifact sourceJar
    }
}
