apply plugin: 'groovy'
apply plugin: 'maven-publish'

group = 'no.statkart.sktools.gradle'



dependencies {

    //gradle api til byggesystemm blir benyttet som std
    compile gradleApi()
    compile libraries.commons_io
    compile libraries.commons_lang3

    compile project(':gradle-plugins:weblogic-plugin')

    //test
    testCompile project(':build-utils:test-utils')
    testCompile project(':gradle-plugins:weblogic-wswar-plugin')
}

task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    classifier 'sources'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourceJar
        }
    }
}
