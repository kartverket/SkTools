apply plugin: 'maven'
apply plugin: 'groovy'

group = 'no.statkart.sktools.gradle'



dependencies {
    //std groovy version defined in root project
    groovy libraries.groovy

    //gradle api til byggesystemm blir benyttet som std
    compile gradleApi()
    runtime 'commons-lang:commons-lang:2.6@jar'


    compile project(':build-utils:wsdocgen')
    compile project(':gradle-plugins:weblogic-plugin')

    //test
    testCompile project(':build-utils:test-utils')
    testCompile project(':gradle-plugins:weblogic-wswar-plugin')


}

task sourcesJar(type: Jar, dependsOn:classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
    onlyIf { gradle.taskGraph.hasTask(install) || gradle.taskGraph.hasTask(uploadArchives) } //only when published..
}


artifacts {
    archives sourcesJar
}

