apply plugin: 'groovy'
apply plugin: 'maven-publish'

//deprecated - fjernes i 1.6
group = 'no.statkart.sktools.gradle'

dependencies {
    compileOnly gradleApi()

    implementation project(':gradle-plugins:weblogic-plugin')

    testImplementation gradleTestKit()
    testImplementation project(':build-utils:test-utils')
    testImplementation project(':gradle-plugins:weblogic-wswar-plugin')
}

task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    classifier 'sources'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourceJar
        }
    }
}
