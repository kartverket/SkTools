plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

group = 'no.statkart.sktools.gradle'

java {
    withSourcesJar()
}

publishing {
    publications {
        pluginMaven(MavenPublication) {
            artifactId = 'wsdlgen-plugin'
        }
    }
}


gradlePlugin {
    plugins {
        wsdlgen {
            id = 'sktools.wsdlgen'
            implementationClass = 'no.statkart.sktools.gradle.plugins.wsdlgen.WsdlGenPlugin'
        }
    }
}

dependencies {
    testImplementation project(':build-utils:test-utils')
}

def pluginPropertiesDir = "$buildDir/plugin-properties"

def pluginProperties = [
    sktools_wsdlgen : "no.statkart.sktools:wsdlgen:${version}" as String,
    sktools_wsdlgen_jakarta_platform: libraries.wsdlgen_jakarta_platform,
] as Properties

// inject av verktøy i testkjøring
tasks.register('testProperties') {
    def outputDir = file("$buildDir/$name")
    def wsdlGenClasspath = project(':build-utils:wsdlgen').sourceSets.main.runtimeClasspath

    inputs.files wsdlGenClasspath
    outputs.dir outputDir

    doLast {
        def properties = [
            sktools_wsdlgen_classpath: wsdlGenClasspath.asPath,
        ]
        outputDir.mkdirs()
        def props = new Properties()
        props.putAll(properties)
        def outputFile = layout.projectDirectory.file("$outputDir/WsdlGenPluginTest.properties").asFile
        outputFile.withOutputStream { props.store(it, null) }
    }
}
pluginUnderTestMetadata.pluginClasspath.from files(testProperties)
pluginUnderTestMetadata.pluginClasspath.from sourceSets.main.output


tasks.register('createPluginProperties') {
    outputs.dir pluginPropertiesDir
    inputs.properties pluginProperties
    doLast {
        def file = layout.projectDirectory.file("$pluginPropertiesDir/no/statkart/sktools/wsdlgen-gradle-plugin.properties").asFile
        file.parentFile.mkdirs()
        def props = new Properties()
        props.putAll(pluginProperties)
        file.withOutputStream { props.store(it, null) }
        logger.info "Created plugin info file: ${file.getAbsolutePath()}"
    }
}
sourceSets.main.resources.srcDir createPluginProperties
