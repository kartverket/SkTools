apply plugin: 'maven'
apply plugin: 'groovy'

project.version = '1.2'
group = 'no.statkart.sktools.gradle'



dependencies {
    //std groovy version defined in root project
    groovy libraries.groovy

    //gradle api til byggesystemm blir benyttet som std
    compile gradleApi()
    runtime 'commons-lang:commons-lang:2.6@jar'
    runtime 'commons-io:commons-io:1.4@jar'
    runtime 'commons-codec:commons-codec:1.2@jar'


    //test
    testCompile project(':build-utils:test-utils')

}


