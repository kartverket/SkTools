include ':echo-client'
include ':simple-webstart-app'
include ':SKIF-209_uptodate'

rootProject.name = 'webstart-demos'


//eksempel implementasjon på SNAPSHOT versjonering
gradle.projectsLoaded { Gradle g ->
//    println 'gradle.projectsLoaded()'
//    println startParameter.taskNames

    if (!startParameter.taskNames.contains('release')) {
        g.rootProject.allprojects {
            it.afterEvaluate {
                it.version += "-SNAPSHOT"
            }
        }
    } else {
        startParameter.taskNames.remove('release')

        println 'Configuring build for release!'
    }

}


//automatisk re-compile og install av siste versjon av plugin til lokal maven (spesifikt for demo-prosjekt)
gradle.projectsLoaded { Gradle g ->
    final File projectDir = g.rootProject.file('..')

    //dersom ikke nested bygg..
    if (g.startParameter.systemPropertiesArgs['noMavenBootstrap']) {
        logger.info "Skipping maven install doe to -DnoMavenBootstrap=${g.startParameter.systemPropertiesArgs['noMavenBootstrap']}"
    } else {
        logger.quiet 'Asserting project is up to date. Running build on root-project:'

        org.gradle.tooling.ProjectConnection connection = org.gradle.tooling.GradleConnector.newConnector().forProjectDirectory(projectDir).connect()
        try {
            connection.newBuild().forTasks('install').run()
        } finally {
            connection.close()
        }
    }
}
