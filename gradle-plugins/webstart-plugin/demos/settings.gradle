include ':echo-client'
include ':simple-webstart-app'
include ':SKIF-209_uptodate'

rootProject.name = 'webstart-demos'


//eksempel implementasjon på SNAPSHOT versjonering
gradle.projectsLoaded { Gradle g ->
//    println 'gradle.projectsLoaded()'
//    println startParameter.taskNames

    if (!startParameter.taskNames.contains('release')) {
        g.rootProject.allprojects {
            it.afterEvaluate {
                it.version += "-SNAPSHOT"
            }
        }
    } else {
        startParameter.taskNames.remove('release')

        println 'Configuring build for release!'
    }

}


//automatisk re-compile og install av siste versjon av plugin til lokal maven (spesifikt for demo-prosjekt)
gradle.projectsLoaded { Gradle g ->
    //dersom ikke nested bygg..
    if (g.parent == null) {
        if (!startParameter.taskNames.isEmpty()) {
            g.rootProject.buildscript {
                StartParameter sp = gradle.startParameter.newBuild()
                sp.taskNames = ['install']
                sp.projectDir = g.rootProject.file('..')

                println 'Asserting project is up to date. Running build on root-project:'
                GradleLauncher.newInstance(sp).run().rethrowFailure();
            }
        }
    }
}
