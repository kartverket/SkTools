plugins {
    id 'groovy'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

group = 'no.statkart.sktools.gradle'

gradlePlugin {
    plugins {
        weblogicWswar {
            id = 'sktools.weblogic-wswar'
            implementationClass = 'no.statkart.sktools.gradle.plugins.weblogic.wswar.WeblogicWsWarPlugin'
        }
    }
}


dependencies {
    implementation project(':gradle-plugins:weblogic-plugin')

    testImplementation project(':build-utils:test-utils')
}

task sourceJar(type: Jar) {
    from sourceSets.main.allSource
    classifier 'sources'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourceJar
        }
    }
}
