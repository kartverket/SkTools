include ':build-utils:wsdocgen'
include ':build-utils:xjc-plugins'

include ':gradle-plugins'
include ':gradle-plugins:dbtools-plugin'
include ':gradle-plugins:provided-plugin'
include ':gradle-plugins:weblogic-plugin'
include ':gradle-plugins:weblogic-wsclient-plugin'
include ':gradle-plugins:weblogic-wswar-plugin'
include ':gradle-plugins:weblogic-deploy-plugin'
