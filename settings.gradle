include ':gradle-plugins:wsdocgen-plugin'
include ':gradle-plugins:wsgen-plugin'
include ':gradle-plugins:wsimport-plugin'
include ':gradle-plugins:xjc-plugin'

include ':gradle-plugins:properties-plugin'
include ':gradle-plugins:filter-resources-plugin'



rootProject.name = properties.get('project_name', 'sktools') //unikt navn kan angis i gradle.properties
rootProject.name += '-gradle-' + org.gradle.util.GradleVersion.current().getVersion()


gradle.rootProject { project -> //nested projects fallback to properties of root project

    if (!project.hasProperty('sktools_versjon')) {
        project.ext.setProperty('sktools_versjon', Project.DEFAULT_VERSION)
    }

    project.ext.MAVEN_REPO = rootProject.properties.get('MAVEN_REPO', System.getenv('MAVEN_REPO'))
    if (project.ext.MAVEN_REPO == null) {
        project.ext.set('MAVEN_REPO', 'https://nexus.statkart.no/repository/public/')
        logger.warn "warning: MAVEN_REPO not defined. Defaulting to ${project.MAVEN_REPO}"
    }
}
