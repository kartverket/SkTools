apply plugin: 'maven'
apply plugin: 'java'
apply plugin: 'groovy'

dependencies {
    //xjc
    compile 'com.sun.xml.bind:jaxb-xjc:2.2.11'
    compile 'org.glassfish.jaxb:jaxb-xjc:2.2.11', {
        exclude group: 'org.apache.ant', module: 'ant' //ant from gradle api - this resolves version conflicts on classpath for testing..
    }

    //jaxb impl og runtime
    compile 'com.sun.xml.bind:jaxb-impl:2.2.11'
    compile 'org.glassfish.jaxb:jaxb-runtime:2.2.11', {
        exclude group: 'org.apache.ant', module: 'ant' //ant from gradle api - this resolves version conflicts on classpath for testing..
    }

    //testing...
    testCompile project(':build-utils:test-utils')
    testCompile gradleApi()

}


task sourcesJar(type: Jar, dependsOn:classes) {
    classifier = 'sources'
    from sourceSets.main.allSource
    onlyIf { gradle.taskGraph.hasTask(install) || gradle.taskGraph.hasTask(uploadArchives) } //only when published..
}


artifacts {
    archives sourcesJar
}
