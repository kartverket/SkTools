apply plugin: 'groovy'

//blir ikke eskponert
//all testkode skal ligge i src/main sourceSet
description = "Intern modul for felles test-logikk."

def testPropertiesDir = "$buildDir/test-properties"
sourceSets {
    main {
        output.dir(testPropertiesDir, builtBy: 'createTestProperties')
    }
}

def pluginProperties = [
        MAVEN_REPO : MAVEN_REPO as String,
] as Properties

dependencies {

    //gradle api til byggesystemm blir benyttet som std
    compile gradleApi()
    compile libraries.guava
    compile libraries.testng
}

task createTestProperties() {
    outputs.dir testPropertiesDir
    inputs.properties pluginProperties
    doLast {
        def file = project.file("$testPropertiesDir/no/statkart/sktools/test.properties")
        file.parentFile.mkdirs()
        final Writer writer = file.newWriter()
        pluginProperties.store(writer, "Generated by Gradle build")
        writer.close()
        assert file.exists()
        logger.info "Created info file: ${file.getAbsolutePath()}"
    }
}
tasks.processResources.dependsOn createTestProperties

// Testfunksjonalitet som avgjør om en kjører tester ifra IntelliJ eller ikke.
// NB: Denne kildekoden skal IKKE med i gradle bygget!!
idea.module {
    testSourceDirs += file('src/idea/test-source')
}
