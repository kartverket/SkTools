import org.gradle.util.GradleVersion

apply plugin: 'groovy'

description = "Intern modul for felles test-logikk."

def testPropertiesDir = "$buildDir/test-properties"

sourceSets {
    sample // ressurser for sample.jar til bruk i tester
}

def pluginProperties = [
        MAVEN_REPO : MAVEN_REPO as String,
        libraries_hsqldb : libraries.hsqldb,
] as Properties

dependencies {
    implementation libraries.guava
    implementation libraries.testng
    implementation libraries.assertj

    implementation gradleTestKit()
    implementation localGroovy()
}

task createTestProperties() {
    outputs.dir testPropertiesDir
    inputs.properties pluginProperties
    doLast {
        def file = project.file("$testPropertiesDir/no/statkart/sktools/test.properties")
        file.parentFile.mkdirs()
        final Writer writer = file.newWriter()
        pluginProperties.store(writer, "Generated by Gradle build")
        writer.close()
        assert file.exists()
        logger.info "Created info file: ${file.getAbsolutePath()}"
    }
}
sourceSets.main.resources.srcDir createTestProperties


task createSampleJar(type: Jar) {
    if (GradleVersion.current() > GradleVersion.version('5.1')) {
        archiveFileName = 'sample.jar.bin'
    } else {
        archiveName = 'sample.jar.bin'
    }
    from(project.sourceSets.sample.output)
    manifest.attributes([
        'Specification-Title': "Sample 1",
        'Implementation-Version': "0.1",
    ])
}
sourceSets.main.output.dir createSampleJar

task createSample2Jar(type: Jar) {
    if (GradleVersion.current() > GradleVersion.version('5.1')) {
        archiveFileName = 'sample2.jar.bin'
    } else {
        archiveName = 'sample2.jar.bin'
    }
    from(project.sourceSets.sample.output)
    manifest.attributes([
        'Specification-Title': "Sample 2",
    ])
}
sourceSets.main.output.dir createSample2Jar