apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'maven-publish'

dependencies {

    //Saxon for xslt 2.0
    //Saxon HE is the open source version
    runtime 'net.sf.saxon:Saxon-HE:9.5.1-8'

    //testing...
    testCompile gradleApi()
    testCompile project(':build-utils:test-utils')

}

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
    classifier "sources"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourceJar
        }
    }
}

